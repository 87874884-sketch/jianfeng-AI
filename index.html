function placeInFront(spec) {
  const dist = 2.4;
  spawn(spec, view.target.x - Math.sin(view.yaw) * dist, view.target.z - Math.cos(view.yaw) * dist, { yaw: view.yaw });
}

function craft(id) {
  const recipes = {
    plank: { need: { wood: 1 }, give: { plank: 4 }, say: "四块木板做好了。" },
    stick: { need: { plank: 2 }, give: { stick: 4 }, say: "四根木棍做好了。" },
    crate: { need: { plank: 4 }, place: "crate", say: "木箱放在你面前了。" },
    torch: { need: { wood: 1, stick: 2 }, place: "lamp", say: "火把放在你面前了。" }
  };
  const recipe = recipes[id];
  if (!recipe) return false;
  for (const key of Object.keys(recipe.need)) {
    if (bag[key] < recipe.need[key]) {
      speak("神谕", "材料不够。走近树，按 E 砍下木头，再来制作。");
      return false;
    }
  }
  for (const key of Object.keys(recipe.need)) bag[key] -= recipe.need[key];
  if (recipe.give) {
    for (const key of Object.keys(recipe.give)) bag[key] += recipe.give[key];
  }
  if (recipe.place) placeInFront(byId[recipe.place]);
  renderBag();
  speak("神谕", recipe.say);
  return true;
}

function tryCraftCommand(text) {
  if (/背包|库存/.test(text)) {
    speak("神谕", "背包里有木头 " + bag.wood + "、木板 " + bag.plank + "、木棍 " + bag.stick + "。");
    return true;
  }
  if (/制作|合成|打造|craft/.test(text)) {
    speak("神谕", "制作菜单已经收起来了。");
    return true;
  }
  return false;
}

function noteGenerationOff() {
  const now = performance.now();
  if (now - genNoteAt < 1600) return;
  genNoteAt = now;
  speak("神谕", "生成先停着。「生成它」认不出「它」是哪一件，只会把快捷栏里的东西扔到地上。");
}

function interactPrompt(it) {
  if (it.kind === "door") return it.open ? "按 E 关门" : "按 E 开门";
  if (it.kind === "lamp") return it.lit ? "按 E 关灯" : "按 E 开灯";
  if (it.kind === "tree") return "按 E 砍树";
  if (it.kind === "person") return "按 E 和" + it.object.npcName + "说话";
  return "按 E";
}

function isTree(o) {
  return !!(o && o.spec && (o.spec.id === "tree" || o.spec.id === "pine"));
}

function flatDist(mesh, x, z) {
  mesh.getWorldPosition(promptV);
  return Math.hypot(promptV.x - x, promptV.z - z);
}

function nearestTree(maxDist) {
  let best = null;
  let bestD = maxDist;
  for (let i = 0; i < objects.length; i++) {
    const o = objects[i];
    if (!isTree(o)) continue;
    const dist = flatDist(o.mesh, view.target.x, view.target.z);
    if (dist < bestD) {
      best = { mesh: o.mesh, kind: "tree", object: o, radius: maxDist };
      bestD = dist;
    }
  }
  return best;
}

function treeInSight() {
  const origin = camera.position.clone();
  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  raycaster.set(origin, dir);
  const hits = raycaster.intersectObjects(objects.map((o) => o.mesh), true);
  for (let i = 0; i < hits.length; i++) {
    let node = hits[i].object;
    while (node && objects.every((o) => o.mesh !== node)) node = node.parent;
    const found = objects.find((o) => o.mesh === node);
    if (isTree(found) && flatDist(found.mesh, view.target.x, view.target.z) < 14) {
      return { mesh: found.mesh, kind: "tree", object: found, radius: 14 };
    }
  }
  return null;
}

function nearestInteract() {
  const px = view.target.x;
  const pz = view.target.z;
  let best = null;
  let bestD = Infinity;
  const consider = (it, dist) => {
    if (dist < bestD) {
      best = it;
      bestD = dist;
    }
  };
  const person = nearestPersonObject(4.6);
  if (person) {
    consider(
      { mesh: person.mesh, kind: "person", object: person },
      Math.hypot(person.mesh.position.x - px, person.mesh.position.z - pz)
    );
  }
  for (let i = 0; i < interactables.length; i++) {
    const it = interactables[i];
    const dist = flatDist(it.mesh, px, pz);
    const reach = it.kind === "door" ? 2.6 : (it.radius || 2.4);
    if (dist <= reach) consider(it, dist);
  }
  const tree = treeInSight() || nearestTree(8);
  if (tree) consider(tree, flatDist(tree.mesh, px, pz));
  return best;
}

function updateInteract(dt) {
  for (let i = 0; i < interactables.length; i++) {
    const it = interactables[i];
    if (it.kind !== "door") continue;
    it.angle += (it.target - it.angle) * Math.min(1, dt * 7);
    it.mesh.rotation.y = it.angle;
  }
  const near = nearestInteract();
  if (!near) {
    promptEl.hidden = true;
    return;
  }
  near.mesh.getWorldPosition(promptV);
  promptV.y += near.kind === "tree" ? 2.2 : near.kind === "person" ? 2.05 : 1.7;
  camera.getWorldDirection(lookDir);
  const facing = promptV.clone().sub(camera.position).dot(lookDir);
  const p = promptV.clone().project(camera);
  const w = stage.clientWidth || 1;
  const h = stage.clientHeight || 1;
  let x = (p.x * 0.5 + 0.5) * w;
  let y = (-p.y * 0.5 + 0.5) * h;
  const onScreen = facing > 0 && x > 24 && x < w - 24 && y > 24 && y < h - 24;
  promptEl.hidden = false;
  promptEl.textContent = interactPrompt(near);
  promptEl.style.left = (onScreen ? x : w * 0.5) + "px";
  promptEl.style.top = (onScreen ? y : h * 0.72) + "px";
}

function applyInteract(it) {
  if (!it) return false;
  if (it.kind === "door") {
    it.open = !it.open;
    it.target = it.open ? 1.2 : 0;
    speak("神谕", it.open ? "门开了。" : "门关上了。");
  } else if (it.kind === "lamp") {
    it.lit = !it.lit;
    it.light.intensity = it.lit ? 1.6 : 0;
    it.bulb.material.emissiveIntensity = it.lit ? 0.7 : 0.02;
    speak("神谕", it.lit ? "灯亮了。" : "灯灭了。");
  } else if (it.kind === "tree") {
    const label = it.object.spec.label;
    removeObject(it.object);
    bag.wood += 3;
    renderBag();
    speak("神谕", "你砍倒了" + label + "，得到三根木头。");
  } else if (it.kind === "person") {
    const o = it.object;
    o.held = true;
    const n = o.npcName;
    const lines = [
      "你好，我是" + n + "。",
      "叫我「" + n + " 去砍树」，或点我选命令。",
      "我可以回家、跟着你，或在房子附近走走。"
    ];
    const i = o.talkN || 0;
    o.talkN = (i + 1) % lines.length;
    sayNpc(o, lines[i]);
  }
  return true;
}

function useInteract() {
  return applyInteract(nearestInteract());
}

function interactFromNode(node) {
  while (node) {
    for (let i = 0; i < interactables.length; i++) {
      const it = interactables[i];
      if (it.mesh === node && (it.kind === "door" || it.kind === "lamp")) return it;
    }
    const found = objects.find((o) => o.mesh === node);
    if (found && isTree(found)) return { mesh: found.mesh, kind: "tree", object: found };
    if (found && isPerson(found)) return { mesh: found.mesh, kind: "person", object: found };
    node = node.parent;
  }
  return null;
}

function interactUnderEvent(ev) {
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((ev.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((ev.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(objects.map((o) => o.mesh), true);
  return hits.length ? interactFromNode(hits[0].object) : null;
}

function castleRise(o, x, z) {
  const p = worldToLocal(o, x, z);
  const c = o.castle;
  if (p.x < -c.hw || p.x > c.hw || p.z < -c.hd || p.z > c.hd) return null;
  const localY = body.y - o.mesh.position.y;
  let best = 0;
  const stairs = c.stairs || (c.stair ? [c.stair] : []);
  for (let i = 0; i < stairs.length; i++) {
    const s = stairs[i];
    if (p.x < s.minX || p.x > s.maxX || p.z < s.minZ || p.z > s.maxZ) continue;
    const t = (s.maxZ - p.z) / (s.maxZ - s.minZ);
    const y = s.base + Math.max(0, Math.min(1, t)) * (s.top - s.base);
    if (y <= localY + 0.75 && y >= best) best = y;
  }
  const floors = c.floors || [];
  for (let i = 0; i < floors.length; i++) {
    const f = floors[i];
    const hole = f.hole;
    if (hole && p.x >= hole.minX && p.x <= hole.maxX && p.z >= hole.minZ && p.z <= hole.maxZ) continue;
    if (f.y <= localY + 0.75 && f.y >= best) best = f.y;
  }
  return best;
}

function surfaceY(x, z) {
  let y = sampleHeight(x, z);
  for (let i = 0; i < objects.length; i++) {
    const o = objects[i];
    if (!o.castle || !o.resting) continue;
    const rise = castleRise(o, x, z);
    if (rise == null) continue;
    y = Math.max(y, o.mesh.position.y + rise);
  }
  return y;
}

function updateBody(dt) {
  const terrain = sampleHeight(view.target.x, view.target.z);
  const bed = surfaceY(view.target.x, view.target.z);
  const lake = terrain < WATER - 0.12 && bed < WATER + 0.05;
  if (view.mode !== "fps" && view.mode !== "third") {
    body.y = lake ? WATER : bed;
    body.vy = 0;
    body.grounded = true;
    body.wet = false;
    return;
  }
  if (body.grounded && keys.space && body.y <= bed + 0.12) {
    body.vy = 7.6;
    body.grounded = false;
  }
  const falling = lake || !body.grounded || body.y > bed + 0.08;
  if (!falling) {
    body.y = bed;
    body.vy = 0;
    body.grounded = true;
    body.wet = false;
    return;
  }
  const prev = body.y;
  body.vy = Math.max(-32, body.vy - 26 * dt);
  body.y += body.vy * dt;
  if (lake && !body.wet && prev >= WATER - 0.05 && body.y < WATER) {
    makeSplash(view.target.x, view.target.z);
    body.wet = true;
  }
  if (body.y <= bed) {
    body.y = bed;
    body.vy = 0;
    body.grounded = true;
    if (!lake) body.wet = false;
  } else {
    body.grounded = false;
  }
}

function objectFromRay() {
  const hits = raycaster.intersectObjects(objects.map((o) => o.mesh), true);
  if (!hits.length) return null;
  let node = hits[0].object;
  while (node && objects.every((o) => o.mesh !== node)) node = node.parent;
  if (!node) return null;
  for (let i = 0; i < objects.length; i++) if (objects[i].mesh === node) return objects[i];
  return null;
}

function objectUnderEvent(ev) {
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((ev.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((ev.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  return objectFromRay();
}

function objectInSight() {
  const origin = camera.position.clone();
  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  raycaster.set(origin, dir);
  const hit = objectFromRay();
  if (hit) return hit;
  let best = null;
  let bestD = 1.6;
  for (let i = 0; i < objects.length; i++) {
    const o = objects[i];
    const dx = o.mesh.position.x - origin.x;
    const dy = (o.mesh.position.y + o.top * 0.5) - origin.y;
    const dz = o.mesh.position.z - origin.z;
    const along = dx * dir.x + dy * dir.y + dz * dir.z;
    if (along < 0.3 || along > 14) continue;
    const miss = Math.hypot(dx - dir.x * along, dy - dir.y * along, dz - dir.z * along);
    const allow = Math.max(bestD, (o.radius || 0.4) + 0.45);
    if (miss < allow && miss < bestD) {
      best = o;
      bestD = miss;
    }
  }
  return best;
}

function setDeleteMode(on) {
  deleteMode = on;
  eraseBtn.classList.toggle("selected", on);
  renderer.domElement.style.cursor = on ? "crosshair" : "";
}

function nearestPersonObject(maxDist) {
  let best = null;
  let bestD = maxDist;
  for (let i = 0; i < objects.length; i++) {
    const o = objects[i];
    if (!isPerson(o)) continue;
    const d = Math.hypot(o.mesh.position.x - view.target.x, o.mesh.position.z - view.target.z);
    if (d < bestD) {
      best = o;
      bestD = d;
    }
  }
  return best;
}

function ownerOf(node) {
  while (node && objects.every((o) => o.mesh !== node)) node = node.parent;
  return objects.find((o) => o.mesh === node) || null;
}

function removalTarget() {
  const origin = camera.position.clone();
  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  raycaster.set(origin, dir);
  const hits = raycaster.intersectObjects(objects.map((o) => o.mesh), true);
  for (let i = 0; i < hits.length; i++) {
    const found = ownerOf(hits[i].object);
    if (isPerson(found)) return found;
  }
  const near = nearestPersonObject(5.5);
  if (near) return near;
  return objectInSight();
}

function tryRemove(target) {
  if (!target) {
    speak("神谕", "附近没有可以删的东西。靠近人再按 Delete。");
    return false;
  }
  const name = target.npcName || (target.spec && target.spec.label) || "它";
  const house = target.house;
  if (target.npcName) usedNames.delete(target.npcName);
  if (selectedNpc === target) {
    selectedNpc = null;
    ordersEl.hidden = true;
  }
  removeObject(target);
  if (house && house.forPerson === target && objects.includes(house)) removeObject(house);
  speak("神谕", "我把" + name + "从世界上拿掉了。");
  return true;
}

function howMany(text) {
  const m = text.match(/(\d+)/);
  if (m) return Math.max(1, Math.min(6, parseInt(m[1], 10)));
  if (/两|俩|二|一对/.test(text)) return 2;
  if (/三/.test(text)) return 3;
  if (/四/.test(text)) return 4;
  if (/五/.test(text)) return 5;
  if (/很多|许多|一群|一片|一大片/.test(text)) return 6;
  if (/几|一些/.test(text)) return 4;
  return 1;
}

function parse(text) {
  const lower = text.toLowerCase();
  const mask = Array(lower.length).fill(false);
  const keys = [];
  for (const spec of CATALOG) {
    for (const word of spec.words) keys.push({ word: word.toLowerCase(), spec });
  }
  keys.sort((a, b) => b.word.length - a.word.length);
  const found = [];
  for (const key of keys) {
    let from = 0;
    while (from < lower.length) {
      const i = lower.indexOf(key.word, from);
      if (i < 0) break;
      const end = i + key.word.length;
      let covered = false;
      for (let c = i; c < end; c++) if (mask[c]) covered = true;
      const latin = /^[a-z]/.test(key.word);
      const before = i > 0 ? lower[i - 1] : " ";
      const after = end < lower.length ? lower[end] : " ";
      const boundary = !latin || (!/[a-z]/.test(before) && !/[a-z]/.test(after));
      if (!covered && boundary) {
        for (let c = i; c < end; c++) mask[c] = true;
        found.push(key.spec);
        from = end;
      } else from = i + 1;
    }
  }
  return [...new Map(found.map((s) => [s.id, s])).values()];
}

function numWord(n) {
  return ["", "一", "两", "三", "四", "五", "六"][n] || String(n);
}

function sayNpc(o, line) {
  o.say = line;
  o.sayT = 6;
  speak(o.npcName || "人", line);
}

function assignTask(o, task, foe) {
  if (!o || !isPerson(o)) return;
  o.held = false;
  o.pause = 0;
  if (task === "chop") {
    o.order = "chop";
    o.life = "out";
    sayNpc(o, "我去砍树。");
  } else if (task === "home") {
    if (!o.house) sayNpc(o, "我还没有自己的房子。");
    else {
      o.order = "home";
      o.life = "gohome";
      o.lifeT = 0;
      setDoor(o.house, true);
      sayNpc(o, "我回家。");
    }
  } else if (task === "follow") {
    o.order = "follow";
    o.life = "out";
    sayNpc(o, "我跟着你。");
  } else if (task === "stay") {
    o.order = "stay";
    sayNpc(o, "我停下。");
  } else if (task === "sit") {
    o.order = "sit";
    sayNpc(o, "我坐下。");
  } else if (task === "wander") {
    o.order = "wander";
    o.life = "out";
    o.lifeT = 6;
    o.foe = null;
    chooseWanderGoal(o);
    sayNpc(o, "我在家附近走走。");
  } else if (task === "fight") {
    beginFight(o, foe);
  } else {
    sayNpc(o, "我是" + o.npcName + "。可以说「" + o.npcName + " 去砍树」。");
  }
}

function beginFight(a, b) {
  if (!a || !isPerson(a)) return;
  if (!b || !isPerson(b) || b === a) {
    sayNpc(a, "我不知道要打谁。");
    return;
  }
  a.foe = b;
  b.foe = a;
  a.order = "fight";
  b.order = "fight";
  a.life = "out";
  b.life = "out";
  a.held = false;
  b.held = false;
  a.pause = 0;
  b.pause = 0;
  b.phase = a.phase + Math.PI;
  sayNpc(a, "我和" + b.npcName + "打起来了。");
  sayNpc(b, "来吧。");
}

function fightAsked(text) {
  return /打架|打起来|开战|动手|打一场|对打|去找.+打|找.+打/.test(text);
}

function namedPeople(text, people) {
  const named = [];
  for (let i = 0; i < people.length; i++) {
    const person = people[i];
    if (!person.npcName) continue;
    const at = text.indexOf(person.npcName);
    if (at >= 0) named.push({ person, at });
  }
  named.sort((a, b) => a.at - b.at);
  return named;
}

function handleNpcTalk(text) {
  const people = objects.filter(isPerson);
  const named = namedPeople(text, people);
  let who = named.length ? named[0].person : null;
  const command = /砍树|砍木|回家|进屋|跟着|过来|跟随|停下|别动|站住|坐下|起来|散步|散开|自己走|训练|你好|您好|你是谁|叫什么/.test(text) || fightAsked(text);
  if (!who && command) who = nearestPersonObject(8);
  if (!who) return false;
  if (!command && text.length > 16 && !text.includes(who.npcName)) return false;
  if (/训练/.test(text)) {
    const trick = text.replace(who.npcName, "").replace(/训练/g, "").trim() || "握手";
    oTrick(who, trick);
    return true;
  }
  if (/砍树|砍木/.test(text)) assignTask(who, "chop");
  else if (fightAsked(text)) {
    let foe = named.length > 1 ? named[1].person : null;
    if (foe === who) foe = named.length > 2 ? named[2].person : null;
    if (!foe) {
      let best = 1e9;
      for (let i = 0; i < people.length; i++) {
        const p = people[i];
        if (p === who) continue;
        const d = Math.hypot(p.mesh.position.x - who.mesh.position.x, p.mesh.position.z - who.mesh.position.z);
        if (d < best) {
          best = d;
          foe = p;
        }
      }
    }
    assignTask(who, "fight", foe);
  }
  else if (/回家|进屋/.test(text)) assignTask(who, "home");
  else if (/过来|跟着|跟随/.test(text)) assignTask(who, "follow");
  else if (/停下|别动|站住/.test(text)) assignTask(who, "stay");
  else if (/坐下/.test(text)) assignTask(who, "sit");
  else if (/起来|散步|散开|自己走/.test(text)) assignTask(who, "wander");
  else if (/你是谁|叫什么/.test(text)) sayNpc(who, "我叫" + who.npcName + "。");
  else if (/你好|您好/.test(text)) sayNpc(who, "你好，我是" + who.npcName + "。");
  else sayNpc(who, "我听到了。试着说「" + who.npcName + " 去砍树」或「" + who.npcName + " 回家」。");
  return true;
}

function oTrick(who, trick) {
  who.tricks[trick] = true;
  who.wave = 1.4;
  who.order = "stay";
  sayNpc(who, "我学会了「" + trick + "」。");
}

function mentionsPronoun(text) {
  return /它|这个|这件|\bit\b|\bthis\b/.test(text.toLowerCase());
}

function lookedAtSpec() {
  const hit = objectInSight();
  return hit && hit.spec ? hit.spec : null;
}

function resolvePronoun(text) {
  const lower = text.toLowerCase();
  const wantsThis = /这个|这件|\bthis\b/.test(lower);
  const wantsIt = /它|\bit\b/.test(lower);
  const seen = lookedAtSpec();
  if (wantsThis && !wantsIt) return seen || lastMentioned;
  if (wantsIt && !wantsThis) return lastMentioned || seen;
  return seen || lastMentioned;
}

function createFromText(text) {
  if (tryCraftCommand(text)) return;
  if (handleNpcTalk(text)) return;
  if (!GENERATION_ON) {
    noteGenerationOff();
    return;
  }
  let matched = parse(text);
  if (!matched.length && mentionsPronoun(text)) {
    const resolved = resolvePronoun(text);
    if (!resolved) {
      speak("神谕", "我不知道「它」是哪一件。先说出名字，或看着那样东西再说。我不会把快捷栏里的东西扔下去。");
      return;
    }
    matched = [resolved];
  }
  if (!matched.length) {
    if (/帮助|怎么|可以造|help/.test(text)) {
      speak("神谕", "可以说城堡、房子、树、松树、花、草、山、河、湖、云、路、桥、塔、狗、猫、马、鸟、鱼、人、椅子、桌子、灯、汽车、船。走近树按 E 砍木头，按 C 制作木板、木棍、木箱或火把。走近门按 E 开门。");
      return;
    }
    if (/放|造|建|种|生成|放置/.test(text)) {
      speak("神谕", "我没认出要放的是什么。请直接说出名字，比如石头、木头或房子。");
      return;
    }
    speak("神谕", "我还不会造这个。试着说「造一座房子」「种一棵树」「来一条河」或「一个人」。也可以说「帮助」。");
    return;
  }
  const focus = lookPoint() || view.target;
  const said = [];
  const count = howMany(text);
  for (const spec of matched) {
    const n = spec.terrain ? Math.min(spec.id === "mountain" ? 3 : 1, count) : Math.min(6, count);
    for (let i = 0; i < n; i++) {
      const ang = i * 1.7;
      const dist = n === 1 ? 0 : 3 + i * 1.4;
      const x = focus.x + Math.cos(ang) * dist;
      const z = focus.z + Math.sin(ang) * dist;
      if (spec.terrain) addTerrainFeature(spec, x, z);
      else spawn(spec, x, z, { yaw: view.yaw });
    }
    said.push(numWord(n) + spec.unit + spec.label);
    lastMentioned = spec;
  }
  speak("神谕", "我放下了" + said.join("、") + "。它们会落在地上，不会叠在一起。");
}

function placeSelected(point) {
  if (!GENERATION_ON) return;
  const held = byId[HOTBAR[selected].id];
  if (!held) return;
  if (held.terrain) addTerrainFeature(held, point.x, point.z);
  else spawn(held, point.x, point.z);
}

function dropHeld() {
  if (!GENERATION_ON) {
    noteGenerationOff();
    return;
  }
  const held = byId[HOTBAR[selected].id];
  if (!held) return;
  const reach = 3.2;
  const x = view.target.x - Math.sin(view.yaw) * reach;
  const z = view.target.z - Math.cos(view.yaw) * reach;
  if (held.terrain) addTerrainFeature(held, x, z);
  else spawn(held, x, z, { yaw: view.yaw });
}

function findShore(cx, cz) {
  for (let r = 10; r < 46; r += 2) {
    for (let a = 0; a < 6.28; a += 0.45) {
      const x = cx + Math.cos(a) * r;
      const z = cz + Math.sin(a) * r;
      const h = sampleHeight(x, z);
      if (h > WATER + 0.9 && h < WATER + 3.2) return { x, z };
    }
  }
  return { x: cx + 24, z: cz };
}

function seedWorld() {
  const trees = [[-42, -12], [-70, 22], [-28, -52], [52, -40], [78, 24], [-86, -18], [34, 62], [-16, 54], [120, -30], [-6, -70], [64, -86], [-72, -64], [24, -48], [-110, 30], [96, 36], [140, -70]];
  trees.forEach((p, i) => {
    if (sampleHeight(p[0], p[1]) > WATER + 1.4) spawn(byId[i % 4 === 0 ? "pine" : "tree"], p[0], p[1], { settle: true });
  });
  const shore = findShore(8, 16);
  spawn(byId.house, shore.x, shore.z, { settle: true, yaw: 0.6 });
  const castleX = shore.x + 36;
  const castleZ = shore.z - 30;
  const castleGround = sampleHeight(castleX, castleZ);
  const castleAt = castleGround > WATER + 1.2 ? { x: castleX, z: castleZ } : { x: shore.x - 46, z: shore.z + 8 };
  spawn(byId.castle, castleAt.x, castleAt.z, { settle: true, yaw: 0.4 });
  spawn(byId.dog, shore.x + 3.4, shore.z + 1.2, { settle: true });
  for (let i = 0; i < 6; i++) spawn(byId.flower, shore.x - 2 + (i % 3), shore.z + 2 + Math.floor(i / 3), { settle: true });
  spawn(byId.grass, shore.x + 2, shore.z - 2, { settle: true });
  if (sampleHeight(48, -28) > WATER + 2) spawn(byId.deer, 48, -28, { settle: true });
  if (sampleHeight(-20, 40) > WATER + 1) spawn(byId.rabbit, -20, 40, { settle: true });
  spawn(byId.bird, 12, 0, { settle: true });
  spawn(byId.bird, -6, 22, { settle: true });
  spawn(byId.boat, 8, 16, { settle: true });
  spawn(byId.fish, 12, 20, { settle: true });
  for (let i = 0; i < 5; i++) spawn(byId.cloud, -90 + i * 48, -30 + (i % 2) * 36, { settle: true });
  view.target.set(shore.x + 8, 0, shore.z + 6);
  view.yaw = -0.65;
  view.pitch = 0.46;
  view.dist = 26;
}

function resize() {
  const w = stage.clientWidth || 1;
  const h = stage.clientHeight || 1;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}

function updateCamera() {
  const x = view.target.x;
  const z = view.target.z;
  const onFoot = view.mode === "fps" || view.mode === "third";
  const ground = onFoot ? body.y : walkY(x, z);
  if (view.mode === "third") {
    view.pitch = Math.max(0.12, Math.min(1.05, view.pitch));
    view.dist = Math.max(3.2, Math.min(12, view.dist));
    const face = view.front ? -1 : 1;
    const cp = Math.cos(view.pitch);
    camera.position.set(
      x + Math.sin(view.yaw) * cp * view.dist * face,
      body.y + 1.35 + Math.sin(view.pitch) * view.dist * 0.85,
      z + Math.cos(view.yaw) * cp * view.dist * face
    );
    const lift = sampleHeight(camera.position.x, camera.position.z) + 0.45;
    if (camera.position.y < lift) camera.position.y = lift;
    camera.lookAt(x, body.y + 1.2, z);
    camera.fov = 50;
  } else if (view.mode === "fps") {
    view.pitch = Math.max(-1.15, Math.min(1.15, view.pitch));
    let eye = ground + 1.65;
    const bed = sampleHeight(x, z);
    if (bed < WATER - 0.12 && ground < WATER - 0.02) eye = Math.min(eye, WATER - 0.45);
    camera.position.set(x, eye, z);
    const cp = Math.cos(view.pitch);
    camera.lookAt(x - Math.sin(view.yaw) * cp, eye + Math.sin(view.pitch), z - Math.cos(view.yaw) * cp);
    camera.fov = view.fov;
  } else {
    view.pitch = Math.max(0.2, Math.min(1.12, view.pitch));
    const cp = Math.cos(view.pitch);
    camera.position.set(
      x + Math.sin(view.yaw) * cp * view.dist,
      ground + 1.4 + Math.sin(view.pitch) * view.dist,
      z + Math.cos(view.yaw) * cp * view.dist
    );
    const lift = walkY(camera.position.x, camera.position.z) + 1.4;
    if (camera.position.y < lift) camera.position.y = lift;
    camera.lookAt(x, ground + 1.5, z);
    camera.fov = 52;
  }
  camera.updateProjectionMatrix();
  const under = view.mode === "fps" && camera.position.y < WATER - 0.15;
  scene.background.copy(under ? underFog : skyState.fog);
  scene.fog.color.copy(under ? underFog : skyState.fog);
  scene.fog.near = under ? 0.6 : 90;
  scene.fog.far = under ? 18 : 430;
}

const PLAYER_R = 0.22;

function worldToLocal(o, x, z) {
  const dx = x - o.mesh.position.x;
  const dz = z - o.mesh.position.z;
  const c = Math.cos(o.mesh.rotation.y);
  const s = Math.sin(o.mesh.rotation.y);
  return { x: dx * c - dz * s, z: dx * s + dz * c };
}

function localToWorld(o, x, z) {
  const c = Math.cos(o.mesh.rotation.y);
  const s = Math.sin(o.mesh.rotation.y);
  return {
    x: o.mesh.position.x + x * c + z * s,
    z: o.mesh.position.z + -x * s + z * c
  };
}

function overlapBox(px, pz, box, rad) {
  const cx = Math.max(box.minX, Math.min(px, box.maxX));
  const cz = Math.max(box.minZ, Math.min(pz, box.maxZ));
  const dx = px - cx;
  const dz = pz - cz;
  return dx * dx + dz * dz < rad * rad;
}

function distToSeg(px, pz, ax, az, bx, bz) {
  const abx = bx - ax;
  const abz = bz - az;
  const len2 = abx * abx + abz * abz || 1;
  const t = Math.max(0, Math.min(1, ((px - ax) * abx + (pz - az) * abz) / len2));
  return Math.hypot(px - (ax + abx * t), pz - (az + abz * t));
}

function castleHit(o, x, z) {
  const p = worldToLocal(o, x, z);
  const blocks = o.castle.blocks;
  for (let i = 0; i < blocks.length; i++) if (overlapBox(p.x, p.z, blocks[i], PLAYER_R)) return true;
  return false;
}

function shellHit(o, x, z) {
  const s = o.shell;
  const p = worldToLocal(o, x, z);
  const hw = s.w / 2;
  const hd = s.d / 2;
  const t = s.t;
  const boxes = [
    { minX: -hw, maxX: -hw + t, minZ: -hd, maxZ: hd },
    { minX: hw - t, maxX: hw, minZ: -hd, maxZ: hd },
    { minX: -hw, maxX: hw, minZ: -hd, maxZ: -hd + t }
  ];
  if (s.doorX > -hw + 0.02) boxes.push({ minX: -hw, maxX: s.doorX, minZ: hd - t, maxZ: hd });
  const gapR = s.doorX + s.doorW;
  if (gapR < hw - 0.02) boxes.push({ minX: gapR, maxX: hw, minZ: hd - t, maxZ: hd });
  for (let i = 0; i < boxes.length; i++) if (overlapBox(p.x, p.z, boxes[i], PLAYER_R)) return true;
  const ang = s.door ? s.door.angle : 0;
  const ax = s.doorX;
  const az = hd;
  const bx = ax + Math.cos(ang) * s.doorW;
  const bz = az - Math.sin(ang) * s.doorW;
  return distToSeg(p.x, p.z, ax, az, bx, bz) < PLAYER_R + 0.07;
}

function overlapSolid(x, z, ignore) {
  for (let i = 0; i < objects.length; i++) {
    const o = objects[i];
    if (o === ignore || !o.solid || !o.resting) continue;
    if (o.castle) {
      if (castleHit(o, x, z)) return o;
      continue;
    }
    if (o.shell) {
      if (shellHit(o, x, z)) return o;
      continue;
    }
    if (o.behavior === "wander") continue;
    if ((view.mode === "fps" || view.mode === "third") && body.y > o.mesh.position.y + (o.top || 0.4) + 0.05) continue;
    const dx = o.mesh.position.x - x;
    const dz = o.mesh.position.z - z;
    const need = Math.min(o.radius * 0.4 + 0.22, 0.95);
    if (dx * dx + dz * dz < need * need) return o;
  }
  return null;
}

function nudgeOut() {
  const hit = overlapSolid(view.target.x, view.target.z);
  if (!hit || hit.shell) return;
  let dx = view.target.x - hit.mesh.position.x;
  let dz = view.target.z - hit.mesh.position.z;
  if (Math.hypot(dx, dz) < 0.05) {
    dx = -Math.sin(view.yaw);
    dz = -Math.cos(view.yaw);
  }
  const len = Math.hypot(dx, dz) || 1;
  const need = Math.min(hit.radius * 0.4 + 0.28, 1);
  const nx = hit.mesh.position.x + (dx / len) * need;
  const nz = hit.mesh.position.z + (dz / len) * need;
  if (!overlapSolid(nx, nz)) {
    view.target.x = nx;
    view.target.z = nz;
  }
}

function shove(blocker, dirx, dirz) {
  if (!blocker || blocker.shell || blocker.behavior === "wander" || !blocker.spec) return false;
  if (blocker.radius > 0.75) return false;
  const id = blocker.spec.id;
  if (id === "tree" || id === "pine" || id === "house" || id === "cabin" || id === "tower" || id === "car" || id === "truck") return false;
  const px = blocker.mesh.position.x + dirx * 0.6;
  const pz = blocker.mesh.position.z + dirz * 0.6;
  if (overlapSolid(px, pz, blocker)) return false;
  blocker.mesh.position.x = px;
  blocker.mesh.position.z = pz;
  const bed = sampleHeight(px, pz);
  blocker.mesh.position.y = blocker.floats ? Math.max(bed, WATER) : bed;
  blocker.resting = true;
  return true;
}

function tryStep(nx, nz, dirx, dirz) {
  const hit = overlapSolid(nx, nz);
  if (!hit) {
    view.target.x = nx;
    view.target.z = nz;
    return true;
  }
  if (shove(hit, dirx, dirz) && !overlapSolid(nx, nz)) {
    view.target.x = nx;
    view.target.z = nz;
    return true;
  }
  return false;
}

function moveFocus(dt) {
  if (typingInChat()) return;
  let mx = 0;
  let mz = 0;
  const fx = -Math.sin(view.yaw);
  const fz = -Math.cos(view.yaw);
  const rx = Math.cos(view.yaw);
  const rz = -Math.sin(view.yaw);
  if (keys.w || keys.arrowup) { mx += fx; mz += fz; }
  if (keys.s || keys.arrowdown) { mx -= fx; mz -= fz; }
  if (keys.a || keys.arrowleft) { mx -= rx; mz -= rz; }
  if (keys.d || keys.arrowright) { mx += rx; mz += rz; }
  const len = Math.hypot(mx, mz);
  if (!len) {
    if (overlapSolid(view.target.x, view.target.z)) nudgeOut();
    return;
  }
  const speed = (keys.shift ? 42 : 22) * dt;
  mx = (mx / len) * speed;
  mz = (mz / len) * speed;
  const nx = Math.max(-WORLD, Math.min(WORLD, view.target.x + mx));
  const nz = Math.max(-WORLD, Math.min(WORLD, view.target.z + mz));
  const dirx = mx / len;
  const dirz = mz / len;
  if (tryStep(nx, nz, dirx, dirz)) return;
  if (tryStep(nx, view.target.z, dirx, 0)) return;
  if (tryStep(view.target.x, nz, 0, dirz)) return;
  nudgeOut();
}

function wanderGround(x, z) {
  const h = sampleHeight(x, z);
  return h < WATER + 0.3 ? null : h;
}

function wanderBlocked(o, x, z) {
  return !!overlapSolid(x, z, o);
}

function nearestLand(x, z) {
  for (let r = 2; r <= 48; r += 3) {
    for (let a = 0; a < 6.28; a += 0.65) {
      const gx = x + Math.cos(a) * r;
      const gz = z + Math.sin(a) * r;
      if (wanderGround(gx, gz) != null) return { x: gx, z: gz };
    }
  }
  return null;
}

function personTooClose(self, x, z) {
  for (let i = 0; i < objects.length; i++) {
    const other = objects[i];
    if (other === self || !isPerson(other)) continue;
    if (Math.hypot(other.mesh.position.x - x, other.mesh.position.z - z) < 16) return true;
  }
  return false;
}

function chooseWanderGoal(o) {
  const person = isPerson(o);
  const tries = person ? 28 : 10;
  const anchor = person && o.house ? o.house.mesh.position : o.mesh.position;
  const ox = person ? anchor.x : o.homeX;
  const oz = person ? anchor.z : o.homeZ;
  for (let n = 0; n < tries; n++) {
    const ang = Math.random() * Math.PI * 2;
    const rad = person ? 5 + Math.random() * 11 : 2 + Math.random() * 7;
    const gx = ox + Math.cos(ang) * rad;
    const gz = oz + Math.sin(ang) * rad;
    if (Math.abs(gx) > WORLD - 10 || Math.abs(gz) > WORLD - 10) continue;
    if (wanderGround(gx, gz) == null || wanderBlocked(o, gx, gz)) continue;
    if (person && personTooClose(o, gx, gz)) continue;
    o.goalX = gx;
    o.goalZ = gz;
    return;
  }
  o.goalX = ox;
  o.goalZ = oz;
}

function turnToward(mesh, yaw, dt) {
  let d = yaw - mesh.rotation.y;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  const max = dt * 3.4;
  if (d > max) d = max;
  if (d < -max) d = -max;
  mesh.rotation.y += d;
}

function facePlayer(o, dt) {
  const dx = view.target.x - o.mesh.position.x;
  const dz = view.target.z - o.mesh.position.z;
  if (Math.hypot(dx, dz) > 0.2) turnToward(o.mesh, Math.atan2(dx, dz), dt);
}

function poseWalker(o, moving) {
  const swing = moving ? Math.sin(o.phase) * (o.spec && o.spec.id === "dog" ? 0.65 : 0.48) : Math.sin(o.phase * 0.35) * 0.04;
  o.mesh.traverse((node) => {
    const part = node.userData && node.userData.part;
    if (part === "leg" || part === "arm") {
      const sign = node.userData.side > 0 ? 1 : -1;
      node.rotation.x = swing * (part === "arm" ? -sign : sign);
      if (part === "arm") node.rotation.z = sign * -0.08;
      if (part === "arm" && o.wave > 0 && node.userData.side > 0) node.rotation.x = -1.35;
    } else if (part === "tail") {
      node.rotation.y = Math.sin(o.phase * 1.6) * 0.5;
    }
  });
}

function poseFight(o) {
  const swing = Math.sin(o.phase);
  o.mesh.traverse((node) => {
    const part = node.userData && node.userData.part;
    if (part === "arm") {
      const sign = node.userData.side > 0 ? 1 : -1;
      node.rotation.x = -0.55 + swing * 1.15 * sign;
      node.rotation.z = sign * (-0.2 - Math.max(0, swing) * 0.45);
    } else if (part === "leg") {
      const sign = node.userData.side > 0 ? 1 : -1;
      node.rotation.x = Math.sin(o.phase * 0.5) * 0.28 * sign;
    }
  });
}

function updateWander(o, dt) {
  if (o.wave > 0) o.wave = Math.max(0, o.wave - dt);
  if (o.sayT > 0) o.sayT = Math.max(0, o.sayT - dt);
  const floor = wanderGround(o.mesh.position.x, o.mesh.position.z);
  let stand = floor == null ? sampleHeight(o.mesh.position.x, o.mesh.position.z) : floor;
  const person = isPerson(o);
  const pdx = view.target.x - o.mesh.position.x;
  const pdz = view.target.z - o.mesh.position.z;
  const pd = Math.hypot(pdx, pdz);
  if (person) {
    if (pd < 4.8) o.held = true;
    else if (pd > 6.4) o.held = false;
    if (floor == null) {
      const land = nearestLand(o.mesh.position.x, o.mesh.position.z);
      if (land) {
        o.goalX = land.x;
        o.goalZ = land.z;
        o.order = o.order === "stay" || o.order === "sit" ? "wander" : o.order;
        o.held = false;
      }
    }
  }
  const sit = person && o.order === "sit";
  if (sit) stand -= 0.42;
  const linger = person && o.held && o.order !== "follow" && o.order !== "fight";
  const followClose = person && o.order === "follow" && pd < 3.3;
  if (linger || followClose || (person && (o.order === "stay" || o.order === "sit"))) {
    o.mesh.position.y = stand;
    o.phase += dt * 1.3;
    if (pd < 18) facePlayer(o, dt);
    poseWalker(o, false);
    return;
  }
  if (person && o.order === "follow") {
    o.goalX = view.target.x + Math.cos(o.phase) * 2.2;
    o.goalZ = view.target.z + Math.sin(o.phase) * 2.2;
    o.pause = 0;
  }
  if (person && o.order === "fight") {
    const foe = o.foe;
    const gone = !foe || !isPerson(foe) || !foe.mesh || !foe.mesh.parent || foe.order !== "fight";
    if (gone) {
      o.foe = null;
      o.order = "wander";
      chooseWanderGoal(o);
    } else {
      const fdx = foe.mesh.position.x - o.mesh.position.x;
      const fdz = foe.mesh.position.z - o.mesh.position.z;
      const fd = Math.hypot(fdx, fdz) || 0.001;
      if (fd > 1.35) {
        o.goalX = foe.mesh.position.x;
        o.goalZ = foe.mesh.position.z;
        o.pause = 0;
        o.life = "out";
      } else {
        turnToward(o.mesh, Math.atan2(fdx, fdz), dt);
        o.phase += dt * 8;
        o.mesh.position.y = stand;
        if (fd < 0.9) {
          o.mesh.position.x -= (fdx / fd) * dt * 0.7;
          o.mesh.position.z -= (fdz / fd) * dt * 0.7;
        } else if (Math.sin(o.phase) > 0.9) {
          foe.mesh.position.x += (fdx / fd) * 0.06;
          foe.mesh.position.z += (fdz / fd) * 0.06;
        }
        poseFight(o);
        return;
      }
    }
  }
  if (person && o.order === "chop" && !o.held) {
    let tree = null;
    let best = 1e9;
    for (let i = 0; i < objects.length; i++) {
      if (!isTree(objects[i])) continue;
      const d = Math.hypot(objects[i].mesh.position.x - o.mesh.position.x, objects[i].mesh.position.z - o.mesh.position.z);
      if (d < best) {
        best = d;
        tree = objects[i];
      }
    }
    if (!tree) {
      sayNpc(o, "附近没有树。");
      o.order = "wander";
    } else if (best < 1.8) {
      removeObject(tree);
      bag.wood += 3;
      renderBag();
      o.wave = 1.2;
      o.order = "wander";
      sayNpc(o, "树砍好了，木头在你背包里。");
    } else {
      o.goalX = tree.mesh.position.x;
      o.goalZ = tree.mesh.position.z;
      o.pause = 0;
      o.life = "out";
    }
  }
  if (person && o.house && o.house.mesh.parent && !o.held && o.order !== "follow" && o.order !== "chop" && o.order !== "stay" && o.order !== "sit" && o.order !== "fight") {
    if (o.order === "home") o.life = "gohome";
    if (o.life === "out") {
      o.lifeT -= dt;
      if (o.lifeT <= 0) {
        o.life = "gohome";
        setDoor(o.house, true);
      }
    }
    if (o.life === "gohome") {
      setDoor(o.house, true);
      const pts = homePoints(o);
      const dOut = Math.hypot(o.mesh.position.x - pts.outside.x, o.mesh.position.z - pts.outside.z);
      const dIn = Math.hypot(o.mesh.position.x - pts.inside.x, o.mesh.position.z - pts.inside.z);
      if (dOut > 1.15 && dIn > 1.35) {
        o.goalX = pts.outside.x;
        o.goalZ = pts.outside.z;
      } else {
        o.goalX = pts.inside.x;
        o.goalZ = pts.inside.z;
        if (dIn < 0.8) {
          o.mesh.position.x = pts.inside.x;
          o.mesh.position.z = pts.inside.z;
          o.life = "inside";
          o.lifeT = 12;
          o.order = "wander";
          setDoor(o.house, false);
        }
      }
      o.pause = 0;
    } else if (o.life === "inside") {
      o.lifeT -= dt;
      o.mesh.position.y = stand;
      o.phase += dt;
      poseWalker(o, false);
      if (o.lifeT > 0) return;
      o.life = "leave";
      setDoor(o.house, true);
    } else if (o.life === "leave") {
      setDoor(o.house, true);
      const pts = homePoints(o);
      o.goalX = pts.outside.x;
      o.goalZ = pts.outside.z;
      o.pause = 0;
      if (Math.hypot(o.mesh.position.x - pts.outside.x, o.mesh.position.z - pts.outside.z) < 0.85) {
        o.life = "out";
        o.lifeT = 8 + Math.random() * 8;
        setDoor(o.house, false);
        chooseWanderGoal(o);
      }
    }
  }
  if (o.pause > 0) {
    o.pause -= dt;
    o.phase += dt * 1.6;
    o.mesh.position.y = stand;
    poseWalker(o, false);
    return;
  }
  const px = o.mesh.position.x;
  const pz = o.mesh.position.z;
  const dx = o.goalX - px;
  const dz = o.goalZ - pz;
  const dist = Math.hypot(dx, dz);
  if (dist < 0.55) {
    if (!(person && (o.life === "gohome" || o.life === "leave" || o.order === "chop" || o.order === "home" || o.order === "fight"))) chooseWanderGoal(o);
    o.pause = person ? 0.2 : 0.45 + Math.random() * 1.1;
    o.mesh.position.y = stand;
    poseWalker(o, false);
    return;
  }
  const face = Math.atan2(dx, dz);
  turnToward(o.mesh, face, dt);
  let diff = face - o.mesh.rotation.y;
  while (diff > Math.PI) diff -= Math.PI * 2;
  while (diff < -Math.PI) diff += Math.PI * 2;
  const align = Math.max(0.28, Math.cos(diff));
  const gait = 0.84 + Math.sin(o.phase * 0.5) * 0.16;
  const step = Math.min(dist, (o.speed || 1.5) * gait * align * dt);
  const nx = px + (dx / dist) * step;
  const nz = pz + (dz / dist) * step;
  const wetNow = floor == null;
  const nextDry = wanderGround(nx, nz) != null;
  const clear = !wanderBlocked(o, nx, nz) && (nextDry || wetNow);
  if (!clear) {
    const side = o.stuck % 2 === 0 ? 1 : -1;
    const sx = px + (-dz / dist) * step * 1.4 * side;
    const sz = pz + (dx / dist) * step * 1.4 * side;
    const sideDry = wanderGround(sx, sz) != null;
    if (!wanderBlocked(o, sx, sz) && (sideDry || wetNow)) {
      o.mesh.position.x = sx;
      o.mesh.position.z = sz;
    }
    o.stuck += 1;
    if (o.stuck > 10) {
      if (!(person && (o.life === "gohome" || o.life === "leave" || o.order === "chop" || o.order === "fight"))) chooseWanderGoal(o);
      o.stuck = 0;
      o.pause = 0.25;
    }
  } else {
    o.stuck = 0;
    o.mesh.position.x = nx;
    o.mesh.position.z = nz;
    o.phase += dt * 8;
  }
  const gy = wanderGround(o.mesh.position.x, o.mesh.position.z);
  const moved = o.mesh.position.x !== px || o.mesh.position.z !== pz;
  o.mesh.position.y = (gy == null ? sampleHeight(o.mesh.position.x, o.mesh.position.z) : gy) + (moved ? Math.abs(Math.sin(o.phase)) * 0.035 : 0);
  poseWalker(o, moved);
}

function updateObjects(dt) {
  for (let i = 0; i < objects.length; i++) {
    const o = objects[i];
    if (o.behavior === "bob") {
      o.phase += dt;
      o.mesh.position.y = o.baseY + Math.sin(o.phase * 2) * 0.45;
      o.mesh.position.x += Math.cos(o.phase * 0.4) * dt * 1.4;
    } else if (o.behavior === "sky") {
      o.mesh.position.x += dt * 1.6;
      if (o.mesh.position.x > WORLD) o.mesh.position.x = -WORLD;
    } else if (o.behavior === "wander") {
      updateWander(o, dt);
    } else if (o.behavior === "fall" || !o.behavior) {
      const gy = supportY(o);
      if (o.resting && o.mesh.position.y > gy + 0.2) {
        o.resting = false;
        o.vy = 0;
      }
      if (o.resting) continue;
      const prev = o.mesh.position.y;
      o.vy -= 28 * dt;
      o.mesh.position.y += o.vy * dt;
      const bed = sampleHeight(o.mesh.position.x, o.mesh.position.z);
      if (!o.splashed && !o.floats && prev >= WATER && o.mesh.position.y < WATER && bed < WATER - 0.15) {
        makeSplash(o.mesh.position.x, o.mesh.position.z);
        o.splashed = true;
      }
      const landed = supportY(o);
      if (o.mesh.position.y <= landed) {
        o.mesh.position.y = landed;
        o.vy = 0;
        o.resting = true;
      }
    }
  }
}

function setMode(mode) {
  view.mode = mode;
  fpsBtn.classList.toggle("selected", mode === "fps");
  thirdBtn.classList.toggle("selected", mode === "third");
  orbitBtn.classList.toggle("selected", mode === "orbit");
  if (mode === "fps") {
    view.pitch = 0;
    player.visible = false;
    const lock = renderer.domElement.requestPointerLock();
    if (lock && lock.catch) lock.catch(() => {});
  } else if (mode === "third") {
    if (document.pointerLockElement) document.exitPointerLock();
    view.dist = 6.5;
    view.pitch = 0.42;
    player.visible = true;
  } else {
    player.visible = false;
    if (document.pointerLockElement) document.exitPointerLock();
    if (view.pitch < 0.2) view.pitch = 0.46;
  }
}

let drag = null;
renderer.domElement.addEventListener("contextmenu", (e) => e.preventDefault());
renderer.domElement.addEventListener("pointerdown", (e) => {
  if (document.activeElement === sayInput) sayInput.blur();
  renderer.domElement.focus();
  if (view.mode === "fps" && document.pointerLockElement !== renderer.domElement) {
    renderer.domElement.requestPointerLock();
  }
  drag = { x: e.clientX, y: e.clientY, button: e.button, moved: 0 };
  if (!(view.mode === "fps" && document.pointerLockElement === renderer.domElement)) {
    renderer.domElement.setPointerCapture(e.pointerId);
  }
});
renderer.domElement.addEventListener("pointermove", (e) => {
  if (view.mode === "fps" && document.pointerLockElement === renderer.domElement) {
    view.yaw -= e.movementX * 0.0022;
    view.pitch = Math.max(-1.15, Math.min(1.15, view.pitch - e.movementY * 0.002));
    return;
  }
  if (view.mode === "fps" && drag) {
    const dx = e.clientX - drag.x;
    const dy = e.clientY - drag.y;
    drag.x = e.clientX;
    drag.y = e.clientY;
    drag.moved += Math.abs(dx) + Math.abs(dy);
    view.yaw -= dx * 0.005;
    view.pitch = Math.max(-1.15, Math.min(1.15, view.pitch - dy * 0.004));
    return;
  }
  if (!drag) return;
  const dx = e.clientX - drag.x;
  const dy = e.clientY - drag.y;
  drag.x = e.clientX;
  drag.y = e.clientY;
  drag.moved += Math.abs(dx) + Math.abs(dy);
  if (drag.button === 2 || e.shiftKey) {
    const s = view.dist * 0.0022;
    const rx = Math.cos(view.yaw);
    const rz = -Math.sin(view.yaw);
    const fx = -Math.sin(view.yaw);
    const fz = -Math.cos(view.yaw);
    view.target.x += (-rx * dx + fx * dy) * s;
    view.target.z += (-rz * dx + fz * dy) * s;
  } else if (drag.button === 0) {
    view.yaw -= dx * 0.005;
    view.pitch += dy * 0.0035;
  }
});
renderer.domElement.addEventListener("pointerup", (e) => {
  if (drag && drag.button === 0 && drag.moved < 5 && view.mode !== "fps") {
    const hit = objectUnderEvent(e);
    const acted = interactUnderEvent(e);
    if (deleteMode) tryRemove(isPerson(hit) ? hit : (hit || nearestPersonObject(5.5)));
    else if (acted && acted.kind === "person") showOrders(acted.object, e.clientX, e.clientY);
    else if (acted && (acted.kind === "tree" || acted.kind === "door" || acted.kind === "lamp")) applyInteract(acted);
    else if (GENERATION_ON) {
      const point = pointFromEvent(e);
      if (point) placeSelected(point);
    } else ordersEl.hidden = true;
  }
  drag = null;
});
renderer.domElement.addEventListener("click", () => {
  if (view.mode === "fps" && document.pointerLockElement === renderer.domElement) {
    const origin = camera.position.clone();
    const dir = new THREE.Vector3();
    camera.getWorldDirection(dir);
    raycaster.set(origin, dir);
    const acted = interactFromNode((raycaster.intersectObjects(objects.map((o) => o.mesh), true)[0] || {}).object);
    if (deleteMode) tryRemove(objectInSight());
    else if (acted && (acted.kind === "tree" || acted.kind === "door" || acted.kind === "lamp")) applyInteract(acted);
    else {
      const point = lookPoint();
      if (point) placeSelected(point);
    }
  }
});
renderer.domElement.addEventListener("wheel", (e) => {
  e.preventDefault();
  if (view.mode === "fps") view.fov = Math.max(28, Math.min(85, view.fov + e.deltaY * 0.02));
  else if (view.mode === "third") view.dist = Math.max(3.2, Math.min(12, view.dist + e.deltaY * 0.01));
  else view.dist = Math.max(7, Math.min(190, view.dist + e.deltaY * 0.04));
}, { passive: false });

const HOLD = { KeyW: "w", KeyA: "a", KeyS: "s", KeyD: "d", ArrowUp: "arrowup", ArrowDown: "arrowdown", ArrowLeft: "arrowleft", ArrowRight: "arrowright", ShiftLeft: "shift", ShiftRight: "shift", Space: "space" };
function typingInChat() {
  return document.activeElement === sayInput && document.pointerLockElement !== renderer.domElement;
}
window.addEventListener("keydown", (e) => {
  const chatText = document.activeElement === sayInput && sayInput.value.trim();
  if (e.code === "KeyE" && !chatText) {
    if (document.activeElement === sayInput) sayInput.blur();
    useInteract();
    return;
  }
  if (e.code === "KeyV" && !chatText) {
    e.preventDefault();
    if (document.activeElement === sayInput) sayInput.blur();
    setMode(view.mode === "third" ? "fps" : "third");
    return;
  }
  if ((e.code === "Delete" || e.code === "Backspace") && !chatText) {
    e.preventDefault();
    if (document.activeElement === sayInput) sayInput.blur();
    tryRemove(removalTarget());
    return;
  }
  if (typingInChat()) {
    if (e.code === "Escape") {
      sayInput.blur();
      e.preventDefault();
    }
    return;
  }
  if (e.code === "KeyF") { setMode("fps"); return; }
  if (e.code === "KeyQ" && view.mode === "third") { view.front = !view.front; return; }
  if (e.code === "KeyR") { setMode("orbit"); return; }
  if (e.code === "KeyX") { setDeleteMode(!deleteMode); return; }
  let digit = 0;
  if (/^Digit[1-9]$/.test(e.code)) digit = Number(e.code.slice(5));
  else if (/^Numpad[1-9]$/.test(e.code)) digit = Number(e.code.slice(6));
  else if (/^[1-9]$/.test(e.key)) digit = Number(e.key);
  if (digit) {
    selectSlot(digit - 1);
    dropHeld();
    return;
  }
  const k = HOLD[e.code];
  if (!k) return;
  keys[k] = true;
  if (e.code.indexOf("Arrow") === 0 || e.code === "Space") e.preventDefault();
}, true);
window.addEventListener("keyup", (e) => {
  const k = HOLD[e.code];
  if (k) keys[k] = false;
});
window.addEventListener("resize", resize);
fpsBtn.addEventListener("click", () => setMode("fps"));
thirdBtn.addEventListener("click", () => setMode(view.mode === "third" ? "fps" : "third"));
orbitBtn.addEventListener("click", () => setMode("orbit"));
eraseBtn.addEventListener("click", () => setDeleteMode(!deleteMode));
ordersEl.querySelectorAll("button").forEach((btn) => {
  btn.addEventListener("click", (ev) => {
    ev.stopPropagation();
    if (selectedNpc && objects.includes(selectedNpc)) assignTask(selectedNpc, btn.dataset.task);
    ordersEl.hidden = true;
  });
});
document.getElementById("talk").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = sayInput.value.trim();
  if (!text) return;
  speak("你", text, "you");
  sayInput.value = "";
  createFromText(text);
});

function showOrders(person, clientX, clientY) {
  selectedNpc = person;
  orderNameEl.textContent = person.npcName;
  const rect = stage.getBoundingClientRect();
  ordersEl.hidden = false;
  ordersEl.style.left = Math.max(8, Math.min(clientX - rect.left, (stage.clientWidth || 200) - 160)) + "px";
  ordersEl.style.top = Math.max(8, Math.min(clientY - rect.top, (stage.clientHeight || 200) - 220)) + "px";
}

function updateLabels() {
  labelsEl.replaceChildren();
  camera.updateMatrixWorld(true);
  const w = stage.clientWidth || 1;
  const h = stage.clientHeight || 1;
  for (let i = 0; i < objects.length; i++) {
    const o = objects[i];
    if (!isPerson(o) || !o.npcName) continue;
    nameV.set(o.mesh.position.x, o.mesh.position.y + 2.15, o.mesh.position.z);
    const projected = nameV.clone().project(camera);
    if (projected.z > 1) continue;
    const x = (projected.x * 0.5 + 0.5) * w;
    const y = (-projected.y * 0.5 + 0.5) * h;
    if (x < -80 || x > w + 80 || y < -40 || y > h + 40) continue;
    const tag = document.createElement("div");
    tag.className = "npc-tag";
    tag.textContent = o.npcName;
    tag.style.left = x + "px";
    tag.style.top = y + "px";
    labelsEl.appendChild(tag);
    if (o.sayT > 0 && o.say) {
      const say = document.createElement("div");
      say.className = "npc-say";
      say.textContent = o.say;
      say.style.left = x + "px";
      say.style.top = (y - 28) + "px";
      labelsEl.appendChild(say);
    }
  }
}

const player = new THREE.Group();
let playerPhase = 0;
function buildPlayer() {
  buildHuman(player, { s: 1.02, head: 1, broad: true, long: false });
  player.visible = false;
  scene.add(player);
}
function updatePlayer(dt) {
  player.visible = view.mode === "third";
  if (!player.visible) return;
  player.position.set(view.target.x, body.y, view.target.z);
  player.rotation.y = view.yaw + Math.PI;
  const moving = !!(keys.w || keys.a || keys.s || keys.d || keys.arrowup || keys.arrowdown || keys.arrowleft || keys.arrowright);
  if (moving) playerPhase += dt * 8;
  poseWalker({ mesh: player, phase: playerPhase, spec: { id: "person" }, wave: 0 }, moving && body.grounded);
}

buildTerrain();
makeSky();
buildPlayer();
seedWorld();
seeding = false;
resize();
sayInput.blur();
renderer.domElement.tabIndex = 0;
renderer.domElement.focus();
document.addEventListener("pointerdown", (e) => {
  if (e.target === sayInput) return;
  if (document.activeElement === sayInput) sayInput.blur();
});
speak("神谕", "可以说「造一座房子」，也可以看着一件东西说「生成它」。点一个人，或输入他的名字来下命令。靠近人按 Delete 可以请他离开。按 V 能看见自己。");
window.__godsReady = true;
window.__godsProbe = {
  bag: () => ({ wood: bag.wood, plank: bag.plank, stick: bag.stick }),
  body: () => ({ y: body.y, wet: body.wet, mode: view.mode, x: view.target.x, z: view.target.z }),
  setMode,
  setTarget: (x, z) => view.target.set(x, 0, z),
  sample: (x, z) => sampleHeight(x, z),
  water: WATER,
  spawn: (id, x, z) => spawn(byId[id], x, z, { settle: true, yaw: 0 }),
  generation: () => GENERATION_ON,
  dayNight: (elapsed) => {
    if (elapsed != null) updateDayNight(elapsed);
    return { night: skyState.night, sun: sun.intensity, fog: skyState.fog.getHexString() };
  },
  treeGaps: () => objects.filter((o) => isTree(o)).map((o) => {
    o.mesh.updateWorldMatrix(true, true);
    const box = new THREE.Box3().setFromObject(o.mesh);
    const bed = sampleHeight(o.mesh.position.x, o.mesh.position.z);
    raycaster.set(new THREE.Vector3(o.mesh.position.x, bed + 80, o.mesh.position.z), new THREE.Vector3(0, -1, 0));
    const hit = raycaster.intersectObject(terrain, false)[0];
    const ground = hit ? hit.point.y : bed;
    return {
      id: o.spec.id,
      y: Math.round(o.mesh.position.y * 100) / 100,
      minY: Math.round(box.min.y * 100) / 100,
      ground: Math.round(ground * 100) / 100,
      gap: Math.round((box.min.y - ground) * 100) / 100
    };
  }),
  people: () => objects.filter(isPerson).map((o) => ({
    name: o.npcName, order: o.order, life: o.life, house: !!o.house,
    foe: o.foe ? o.foe.npcName : null,
    x: o.mesh.position.x, z: o.mesh.position.z
  })),
  player: () => ({ visible: player.visible, kids: player.children.length, mode: view.mode }),
  removeNear: () => tryRemove(removalTarget()),
  count: (id) => objects.filter((o) => o.spec && o.spec.id === id).length,
  at: (id) => objects.filter((o) => o.spec && o.spec.id === id).map((o) => ({
    x: Math.round(o.mesh.position.x * 10) / 10,
    y: Math.round(o.mesh.position.y * 10) / 10,
    z: Math.round(o.mesh.position.z * 10) / 10
  })),
  use: () => useInteract(),
  craft: (id) => craft(id),
  near: () => {
    const n = nearestInteract();
    return n ? n.kind : null;
  },
  prompt: () => (promptEl.hidden ? "" : promptEl.textContent),
  drop: () => dropHeld(),
  movers: () => objects.filter((o) => o.behavior === "wander").map((o) => ({
    id: o.spec.id, x: o.mesh.position.x, y: o.mesh.position.y, z: o.mesh.position.z
  })),
  yaw: () => view.yaw,
  rockAt: (x, z) => {
    const rocks = objects.filter((o) => o.spec && o.spec.id === "rock");
    let best = null;
    let bestD = 1e9;
    for (let i = 0; i < rocks.length; i++) {
      const d = Math.hypot(rocks[i].mesh.position.x - x, rocks[i].mesh.position.z - z);
      if (d < bestD) { best = rocks[i]; bestD = d; }
    }
    return best ? { y: best.mesh.position.y, resting: best.resting, splashed: best.splashed } : null;
  },
  keys,
  roofs: () => objects.filter((o) => o.spec && (o.spec.id === "house" || o.spec.id === "cabin")).map((o) => {
    const info = [];
    o.mesh.updateWorldMatrix(true, true);
    o.mesh.traverse((n) => {
      if (!n.userData || !n.userData.role) return;
      const box = new THREE.Box3().setFromObject(n);
      info.push({
        role: n.userData.role,
        rx: n.rotation.x, ry: n.rotation.y, rz: n.rotation.z,
        minY: box.min.y, maxY: box.max.y
      });
    });
    return info;
  })
};

function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, clock.getDelta());
  moveFocus(dt);
  updateBody(dt);
  let growing = false;
  for (let i = 0; i < mods.length; i++) {
    if (mods[i].grow < 1) {
      mods[i].grow = Math.min(1, mods[i].grow + dt * 0.55);
      growing = true;
    }
  }
  if (growing) terrainDirty = true;
  if (terrainDirty) {
    rebuildTerrain();
    terrainDirty = false;
    for (let i = 0; i < objects.length; i++) {
      const o = objects[i];
      if (!o.resting || o.behavior === "sky" || o.behavior === "bob" || o.behavior === "float" || o.behavior === "static") continue;
      const y = supportY(o);
      if (o.mesh.position.y > y + 0.35) o.resting = false;
      else if (y > o.mesh.position.y) o.mesh.position.y = y;
    }
  }
  updateObjects(dt);
  updateSplashes(dt);
  water.position.y = WATER + Math.sin(clock.elapsedTime * 0.8) * 0.04;
  updateDayNight(clock.elapsedTime);
  const sunLift = skyState.night ? 18 : 100;
  const sunOff = skyState.night ? 70 : -55;
  sun.position.set(view.target.x + sunOff, sunLift, view.target.z + (skyState.night ? -36 : 30));
  sun.target.position.set(view.target.x, 0, view.target.z);
  sun.target.updateMatrixWorld();
  updatePlayer(dt);
  updateCamera();
  updateInteract(dt);
  updateLabels();
  renderer.render(scene, camera);
}
frame();
  </script>
