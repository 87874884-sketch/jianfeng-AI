<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>神的世界</title>
<style>
  :root {
    --ink: #e7e1d4;
    --dim: #a39886;
    --gold: #c6a15a;
    --panel: #17140f;
    --line: rgba(198, 161, 90, 0.35);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #0c0e13;
    color: var(--ink);
    font: 16px/1.45 "Songti SC", "Noto Serif SC", "PingFang SC", "Microsoft YaHei", Georgia, serif;
  }
  body {
    min-height: 100%;
    display: grid;
    grid-template-rows: auto 1fr auto;
    grid-template-columns: 1fr 320px;
    grid-template-areas:
      "top top"
      "world chat"
      "tools chat";
  }
  header {
    grid-area: top;
    display: flex;
    align-items: baseline;
    gap: 16px;
    padding: 12px 18px;
    border-bottom: 1px solid var(--line);
  }
  header h1 {
    margin: 0;
    font-size: 22px;
    font-weight: normal;
    letter-spacing: 0.18em;
  }
  header p { margin: 0; color: var(--dim); font-size: 14px; }
  .stage {
    grid-area: world;
    position: relative;
    min-height: 0;
    background: #9eb8cc;
  }
  .stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #hint {
    position: absolute;
    left: 14px;
    bottom: 12px;
    max-width: 78%;
    color: rgba(255, 250, 240, 0.92);
    font-size: 13px;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.7);
    pointer-events: none;
  }
  #bag {
    position: absolute;
    left: 14px;
    top: 12px;
    color: rgba(255, 250, 240, 0.95);
    font-size: 14px;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.75);
    pointer-events: none;
  }
  #cycle {
    position: absolute;
    top: 12px;
    right: 14px;
    z-index: 6;
    padding: 4px 12px;
    background: rgba(18, 16, 12, 0.88);
    border: 1px solid var(--gold);
    color: #f3e2b0;
    font-size: 16px;
    letter-spacing: 0.16em;
    pointer-events: none;
  }
  #cycle[data-phase="night"] {
    color: #d7e4ff;
    border-color: #8aa4d4;
  }
  #labels { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
  .npc-tag, .npc-say {
    position: absolute;
    transform: translate(-50%, -120%);
    padding: 3px 8px;
    background: rgba(18, 16, 12, 0.88);
    border: 1px solid var(--gold);
    color: var(--ink);
    font-size: 14px;
    white-space: nowrap;
  }
  .npc-say { font-size: 15px; }
  #orders {
    position: absolute;
    z-index: 7;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 148px;
    padding: 8px;
    background: rgba(18, 16, 12, 0.94);
    border: 1px solid var(--gold);
  }
  #orders[hidden] { display: none; }
  #orders b { color: var(--gold); font-weight: normal; }
  #orders button { text-align: left; cursor: pointer; }
  #prompt {
    position: absolute;
    z-index: 6;
    transform: translate(-50%, -130%);
    padding: 6px 12px;
    background: rgba(18, 16, 12, 0.92);
    border: 1px solid var(--gold);
    color: var(--ink);
    font-size: 16px;
    pointer-events: none;
    white-space: nowrap;
  }
  #craft {
    position: absolute;
    top: 12px;
    right: 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 240px;
    padding: 10px;
    background: rgba(18, 16, 12, 0.9);
    border: 1px solid var(--line);
  }
  #craft[hidden] { display: none; }
  #craft b { color: var(--gold); font-weight: normal; letter-spacing: 0.14em; }
  #craft button { text-align: left; cursor: pointer; }
  .tools {
    grid-area: tools;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 18px 14px;
    border-top: 1px solid var(--line);
    background: #12100c;
  }
  .tools span { color: var(--dim); font-size: 14px; }
  button, input { font: inherit; color: var(--ink); }
  #fps, #orbit, #third, #erase, #craftBtn, #send, .slot, #craft button {
    background: #241e16;
    border: 1px solid var(--line);
    padding: 8px 12px;
    cursor: pointer;
  }
  #fps.selected, #orbit.selected, #third.selected, #erase.selected, .slot.selected {
    border-color: var(--gold);
    box-shadow: inset 0 0 0 1px var(--gold);
    color: var(--gold);
  }
  #hotbar { display: flex; gap: 6px; flex-wrap: wrap; }
  aside {
    grid-area: chat;
    display: flex;
    flex-direction: column;
    border-left: 1px solid var(--line);
    background: var(--panel);
    min-height: 0;
  }
  aside h2 {
    margin: 0;
    padding: 14px 16px 8px;
    font-size: 14px;
    font-weight: normal;
    letter-spacing: 0.22em;
    color: var(--gold);
  }
  #log {
    flex: 1;
    overflow: auto;
    padding: 8px 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg { margin: 0; font-size: 15px; }
  .msg b { font-weight: normal; color: var(--gold); }
  .you b { color: var(--dim); }
  form {
    display: flex;
    gap: 8px;
    padding: 12px;
    border-top: 1px solid var(--line);
  }
  #say {
    flex: 1;
    min-width: 0;
    background: #100e0b;
    border: 1px solid var(--line);
    padding: 8px 10px;
  }
  @media (max-width: 800px) {
    body {
      grid-template-columns: 1fr;
      grid-template-rows: auto 52vh auto 1fr;
      grid-template-areas: "top" "world" "tools" "chat";
    }
    aside { border-left: 0; border-top: 1px solid var(--line); min-height: 240px; }
  }
</style>

<body>

      if (window.__godsReady) return;

  <script type="module">
import * as THREE from "three";

const SIZE = 460;
const SEG = 210;
const WATER = 4.8;
const WORLD = SIZE * 0.48;

const stage = document.getElementById("stage");

const GENERATION_ON = true;

let seeding = true;

let genNoteAt = 0;
let lastMentioned = null;

const cycleEl = document.getElementById("cycle");
let cycleShown = "";
const promptEl = document.getElementById("prompt");
let deleteMode = false;
const interactables = [];
const bag = { wood: 0, plank: 0, stick: 0 };
const body = { y: 8, vy: 0, wet: false, grounded: true };
const promptV = new THREE.Vector3();
const lookDir = new THREE.Vector3();
const nameV = new THREE.Vector3();
const usedNames = new Set();
const NAME_POOL = {
  man: ["阿山", "老周", "林生", "大牛", "石磊"],
  woman: ["阿兰", "小梅", "秀娘", "秋月", "晚晴"],

};

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
renderer.setSize(stage.clientWidth, stage.clientHeight, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xd5e4f2, 90, 430);
scene.background = new THREE.Color(0xd5e4f2);

const camera = new THREE.PerspectiveCamera(52, 1, 0.15, 1400);
const view = {
  mode: "orbit",
  yaw: -0.85,
  pitch: 0.52,
  dist: 86,
  fov: 58,
  front: false,
  target: new THREE.Vector3(18, 0, 6)
};
const keys = {};
let selected = 0;
const objects = [];
const mods = [];
let terrainDirty = false;

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const clock = new THREE.Clock();

function speak(who, text, cls) {
  const p = document.createElement("p");
  p.className = "msg" + (cls ? " " + cls : "");
  const b = document.createElement("b");
  b.textContent = who + " ";
  p.appendChild(b);
  p.appendChild(document.createTextNode(text));
  log.appendChild(p);
  log.scrollTop = log.scrollHeight;
}

function baseHeight(x, z) {
  let h = 9.6;
  h += Math.sin(x * 0.015) * 1.8;
  h += Math.cos(z * 0.012 + 1.1) * 1.35;
  h += Math.sin(x * 0.031 + z * 0.02) * 0.55;
  const d1 = Math.hypot(x - 110, z + 120);
  h += Math.exp(-(d1 * d1) / (2 * 46 * 46)) * 48;
  const d2 = Math.hypot(x + 160, z - 40);
  h += Math.exp(-(d2 * d2) / (2 * 32 * 32)) * 20;
  const ld = Math.hypot(x - 8, z - 16);
  h -= Math.exp(-(ld * ld) / (2 * 22 * 22)) * 9.5;
  const rz = 14 + Math.sin(x * 0.016) * 5;
  const rd = z - rz;
  if (x > -180 && x < 28) h -= Math.exp(-(rd * rd) / (2 * 4.6 * 4.6)) * 7.2;
  return h;
}

function sampleHeight(x, z) {
  let h = baseHeight(x, z);
  for (let i = 0; i < mods.length; i++) {
    const m = mods[i];
    const g = m.grow;
    if (m.kind === "mountain") {
      const d2 = (x - m.x) ** 2 + (z - m.z) ** 2;
      h += Math.exp(-d2 / (2 * m.r * m.r)) * m.amp * g;
    } else if (m.kind === "lake") {
      const d2 = (x - m.x) ** 2 + (z - m.z) ** 2;
      const bowl = Math.exp(-d2 / (2 * m.r * m.r)) * g;
      h -= bowl * Math.max(0, h - (WATER - m.depth));
    } else if (m.kind === "river") {
      const dx = x - m.x;
      const dz = z - m.z;
      const dirx = Math.sin(m.yaw);
      const dirz = Math.cos(m.yaw);
      const along = dx * dirx + dz * dirz;
      const side = dx * dirz - dz * dirx;
      if (along > -2 && along < m.len) {
        const carve = Math.exp(-(side * side) / (2 * m.width * m.width)) * g;
        h -= carve * Math.max(0, h - (WATER - 1.1));
      }
    }
  }
  return h;
}

function sandAmount(x, z) {
  let s = 0;
  for (let i = 0; i < mods.length; i++) {
    const m = mods[i];
    if (m.kind !== "sand") continue;
    const d = Math.hypot(x - m.x, z - m.z);
    if (d < m.r) s = Math.max(s, 1 - d / m.r);
  }
  return s;
}

function walkY(x, z) {
  const t = sampleHeight(x, z);
  return t < WATER ? WATER : t;
}

function hash(x, z) {
  const n = Math.sin(x * 127.1 + z * 311.7) * 43758.5453;
  return n - Math.floor(n);
}

const grassC = new THREE.Color("#4d7d3c");
const sandC = new THREE.Color("#d9c596");
const rockC = new THREE.Color("#7e7a74");
const snowC = new THREE.Color("#eef3f6");
const tint = new THREE.Color();

function colorAt(x, y, z) {
  const hL = sampleHeight(x - 2, z);
  const hR = sampleHeight(x + 2, z);
  const hD = sampleHeight(x, z - 2);
  const hU = sampleHeight(x, z + 2);
  const slope = Math.hypot(hR - hL, hU - hD) / 4;
  tint.copy(grassC);
  const sand = Math.max(sandAmount(x, z), y < WATER + 0.85 ? 0.9 : 0);
  if (sand > 0) tint.lerp(sandC, sand);
  if (slope > 1.15 && y > WATER + 1) tint.lerp(rockC, Math.min(1, (slope - 1.15) / 1.4));
  if (y > 18) tint.lerp(rockC, Math.min(0.85, (y - 18) / 14));
  if (y > 28) tint.lerp(snowC, Math.min(1, (y - 28) / 10));
  const n = 0.9 + hash(x, z) * 0.18;
  tint.multiplyScalar(n);
  return tint;
}

let terrainGeo;
let terrain;

function buildTerrain() {
  terrainGeo = new THREE.PlaneGeometry(SIZE, SIZE, SEG, SEG);
  terrainGeo.rotateX(-Math.PI / 2);
  const count = terrainGeo.attributes.position.count;
  terrainGeo.setAttribute("color", new THREE.BufferAttribute(new Float32Array(count * 3), 3));
  terrain = new THREE.Mesh(terrainGeo, new THREE.MeshStandardMaterial({
    vertexColors: true,
    roughness: 0.94,
    metalness: 0
  }));
  terrain.receiveShadow = true;
  terrain.castShadow = true;
  scene.add(terrain);
  rebuildTerrain();
}

function rebuildTerrain() {
  const pos = terrainGeo.attributes.position;
  const col = terrainGeo.attributes.color;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i);
    const z = pos.getZ(i);
    const y = sampleHeight(x, z);
    pos.setY(i, y);
    colorAt(x, y, z);
    col.setXYZ(i, tint.r, tint.g, tint.b);
  }
  pos.needsUpdate = true;
  col.needsUpdate = true;
  terrainGeo.computeVertexNormals();
  terrainGeo.computeBoundingSphere();
}

const DAY_PHASE = 600;
let skyMat = null;
const skyState = { night: false, fog: new THREE.Color(0xd5e4f2) };
const underFog = new THREE.Color(0x163e52);

function makeSky() {
  const mat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    fog: false,
    uniforms: {
      sunDir: { value: new THREE.Vector3(-0.45, 0.78, 0.28).normalize() },
      topC: { value: new THREE.Color("#2f639e") },
      horC: { value: new THREE.Color("#d7e7f6") },
      botC: { value: new THREE.Color("#c5d2b0") }
    },
    vertexShader: "varying vec3 vW; void main(){ vec4 w = modelMatrix * vec4(position,1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }",
    fragmentShader: "varying vec3 vW; uniform vec3 sunDir; uniform vec3 topC; uniform vec3 horC; uniform vec3 botC; void main(){ vec3 dir = normalize(vW); float h = dir.y; vec3 col = mix(horC, topC, smoothstep(0.0, 0.5, h)); col = mix(botC, col, smoothstep(-0.2, 0.05, h)); float sun = pow(max(dot(dir, sunDir), 0.0), 700.0); float glow = pow(max(dot(dir, sunDir), 0.0), 6.0); col += vec3(1.0, 0.93, 0.78) * sun; col += vec3(1.0, 0.86, 0.68) * glow * 0.28; gl_FragColor = vec4(col, 1.0); }"
  });
  skyMat = mat;
  const sky = new THREE.Mesh(new THREE.SphereGeometry(900, 28, 16), mat);
  scene.add(sky);
}

function updateDayNight(elapsed) {
  const cycle = DAY_PHASE * 2;
  const t = ((elapsed % cycle) + cycle) % cycle;
  const night = t >= DAY_PHASE;
  skyState.night = night;
  skyState.fog.set(night ? 0x24344f : 0xd5e4f2);
  if (cycleEl) {
    const label = night ? "黑夜" : "白天";
    if (cycleShown !== label) {
      cycleShown = label;
      cycleEl.textContent = label;
      cycleEl.dataset.phase = night ? "night" : "day";
    }
  }
  renderer.toneMappingExposure = night ? 1.28 : 1.08;
  if (!skyMat) return;
  skyMat.uniforms.topC.value.set(night ? "#12182e" : "#2f639e");
  skyMat.uniforms.horC.value.set(night ? "#3a4e72" : "#d7e7f6");
  skyMat.uniforms.botC.value.set(night ? "#1a2230" : "#c5d2b0");
  skyMat.uniforms.sunDir.value.set(night ? 0.42 : -0.45, night ? 0.42 : 0.78, night ? -0.25 : 0.28).normalize();
  sun.intensity = night ? 0.7 : 2.6;
  sun.color.set(night ? 0xc9d6f2 : 0xfff2d8);
  fill.intensity = night ? 0.46 : 0.72;
  fill.color.set(night ? 0x4d6494 : 0xd7ebff);
  fill.groundColor.set(night ? 0x2a3324 : 0x6d8a48);
  if (water.material && water.material.color) {
    water.material.color.set(night ? 0x143246 : 0x2f7594);
    water.material.opacity = night ? 0.9 : 0.78;
  }
}

const sun = new THREE.DirectionalLight(0xfff2d8, 2.6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 2;
sun.shadow.camera.far = 240;
sun.shadow.camera.left = -80;
sun.shadow.camera.right = 80;
sun.shadow.camera.top = 80;
sun.shadow.camera.bottom = -80;
sun.shadow.bias = -0.00025;
sun.shadow.normalBias = 0.04;
scene.add(sun);
scene.add(sun.target);
const fill = new THREE.HemisphereLight(0xd7ebff, 0x6d8a48, 0.72);
scene.add(fill);

const water = new THREE.Mesh(
  new THREE.CircleGeometry(SIZE * 0.52, 96),
  new THREE.MeshPhysicalMaterial({
    color: 0x2f7594,
    transparent: true,
    opacity: 0.78,
    roughness: 0.06,
    metalness: 0.08,

  })

water.rotation.x = -Math.PI / 2;

function canvasTex(paint, repeat) {
  const c = document.createElement("canvas");
  c.width = 256;
  c.height = 256;
  paint(c.getContext("2d"));
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  if (repeat) t.repeat.set(repeat, repeat);
  return t;
}

const barkMap = canvasTex((g) => {
  g.fillStyle = "#6a4630";
  g.fillRect(0, 0, 256, 256);
  g.strokeStyle = "#4a2e1d";
  for (let x = 0; x < 256; x += 14) {
    g.beginPath();
    g.moveTo(x, 0);
    g.bezierCurveTo(x + 6, 80, x - 6, 160, x + 2, 256);
    g.stroke();
  }
}, 1);
const plasterMap = canvasTex((g) => {
  g.fillStyle = "#e6d7c3";
  g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 1800; i++) {
    const v = 180 + Math.random() * 50;
    g.fillStyle = "rgba(" + v + "," + (v - 15) + "," + (v - 30) + ",0.35)";
    g.fillRect(Math.random() * 256, Math.random() * 256, 2, 2);
  }
}, 1);
const woodMat = new THREE.MeshStandardMaterial({ color: 0x8a5a32, roughness: 0.78 });
const barkMat = new THREE.MeshStandardMaterial({ map: barkMap, color: 0x8a6244, roughness: 0.9 });
const leafMat = new THREE.MeshStandardMaterial({ color: 0x2f7a3e, roughness: 0.8 });
const leafMat2 = new THREE.MeshStandardMaterial({ color: 0x3e9450, roughness: 0.75 });
const stoneMat = new THREE.MeshStandardMaterial({ color: 0x9a948c, roughness: 0.9 });
const plasterMat = new THREE.MeshStandardMaterial({ map: plasterMap, color: 0xffffff, roughness: 0.86 });
const metalMat = new THREE.MeshStandardMaterial({ color: 0xb7bdc6, roughness: 0.28, metalness: 0.85 });
const glassMat = new THREE.MeshStandardMaterial({ color: 0xb7d7ea, roughness: 0.08, metalness: 0.15, transparent: true, opacity: 0.55 });

function mesh(geo, material, shadows) {
  const m = new THREE.Mesh(geo, material);
  const cast = shadows !== false;
  m.castShadow = cast;
  m.receiveShadow = cast;
  return m;
}

function randColor(h0, h1, s0, s1, l0, l1) {
  return new THREE.Color().setHSL(
    h0 + Math.random() * (h1 - h0),
    s0 + Math.random() * (s1 - s0),
    l0 + Math.random() * (l1 - l0)
  );
}

function buildTree(g, S) {
  const k = S * (0.72 + Math.random() * 0.7);
  const leaves = new THREE.MeshStandardMaterial({ color: randColor(0.22, 0.42, 0.35, 0.7, 0.18, 0.42), roughness: 0.75 });
  const leaves2 = leaves.clone();
  leaves2.color = leaves.color.clone().offsetHSL(0.03, 0, 0.06);
  const trunkH = (1.1 + Math.random() * 0.6) * k;
  const trunk = mesh(new THREE.CylinderGeometry(0.1 * k, 0.18 * k, trunkH, 12), barkMat);
  trunk.position.y = trunkH / 2;
  const crown = 0.55 + Math.random() * 0.45;
  const a = mesh(new THREE.SphereGeometry(crown * k, 16, 12), leaves);
  a.position.y = trunkH + crown * k * 0.45;
  a.scale.set(0.85 + Math.random() * 0.4, 0.9 + Math.random() * 0.45, 0.85 + Math.random() * 0.35);
  const b = mesh(new THREE.SphereGeometry(crown * k * 0.62, 14, 10), leaves2);
  b.position.set((Math.random() - 0.5) * k, a.position.y + 0.25 * k, (Math.random() - 0.5) * k);
  g.add(trunk, a, b);
  const branchMat = barkMat;
  for (let i = 0; i < 3; i++) {
    const len = (0.45 + Math.random() * 0.35) * k;
    const branch = mesh(new THREE.CylinderGeometry(0.035 * k, 0.06 * k, len, 7), branchMat);
    const ang = Math.random() * Math.PI * 2;
    branch.position.set(Math.cos(ang) * 0.15 * k, trunkH * (0.55 + Math.random() * 0.25), Math.sin(ang) * 0.15 * k);
    branch.rotation.z = Math.cos(ang) * 0.9;
    branch.rotation.x = Math.sin(ang) * 0.5;
    const tuft = mesh(new THREE.SphereGeometry(crown * k * 0.38, 10, 8), leaves);
    tuft.position.copy(branch.position);
    tuft.position.y += len * 0.35;
    tuft.position.x += Math.cos(ang) * len * 0.35;
    tuft.position.z += Math.sin(ang) * len * 0.35;
    g.add(branch, tuft);
  }
}

function buildPine(g) {
  const k = 0.75 + Math.random() * 0.8;
  const trunk = mesh(new THREE.CylinderGeometry(0.09 * k, 0.16 * k, 1.15 * k, 10), barkMat);
  trunk.position.y = 0.55 * k;
  const mat = new THREE.MeshStandardMaterial({ color: randColor(0.24, 0.38, 0.35, 0.7, 0.14, 0.32), roughness: 0.86 });
  const layers = 2 + Math.floor(Math.random() * 3);
  for (let i = 0; i < layers; i++) {
    const cone = mesh(new THREE.ConeGeometry((0.85 - i * 0.14) * k, (0.8 + Math.random() * 0.3) * k, 10 + (i % 2)), mat);
    cone.position.y = 1.05 * k + i * 0.52 * k;
    g.add(cone);
  }
  g.add(trunk);
}

function buildFlower(g) {
  const colors = [0xe25b78, 0xf0c93a, 0x7d5ad4, 0xf08a3a, 0xf7f4ef];
  const stem = mesh(new THREE.CylinderGeometry(0.018, 0.026, 0.46, 6), new THREE.MeshStandardMaterial({ color: 0x2c6a34, roughness: 0.8 }));
  stem.position.y = 0.23;
  const petal = new THREE.MeshStandardMaterial({ color: colors[Math.floor(Math.random() * colors.length)], roughness: 0.5 });
  const center = mesh(new THREE.SphereGeometry(0.055, 10, 8), new THREE.MeshStandardMaterial({ color: 0xf3dc6a, roughness: 0.45 }));
  center.position.y = 0.5;
  g.add(stem, center);
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2;
    const p = mesh(new THREE.SphereGeometry(0.065, 10, 8), petal);
    p.position.set(Math.cos(a) * 0.09, 0.5, Math.sin(a) * 0.09);
    g.add(p);
  }
}

function buildGrass(g) {
  const mat = new THREE.MeshStandardMaterial({ color: 0x3c7a34, roughness: 0.9 });
  for (let i = 0; i < 8; i++) {
    const blade = mesh(new THREE.ConeGeometry(0.035, 0.28 + (i % 3) * 0.08, 5), mat);
    blade.position.set(((i % 4) - 1.5) * 0.18, 0.16, (Math.floor(i / 4) - 0.5) * 0.22);
    g.add(blade);
  }
}

function buildBush(g) {
  const mat = new THREE.MeshStandardMaterial({ color: 0x2f6b38, roughness: 0.85 });
  const a = mesh(new THREE.SphereGeometry(0.42, 14, 12), mat);
  a.position.y = 0.32;
  const b = mesh(new THREE.SphereGeometry(0.28, 12, 10), mat);
  b.position.set(0.28, 0.26, 0.08);
  g.add(a, b);
}

function buildGlass(g) {

    roughness: 0.05,
    metalness: 0.05,
    transmission: 0.85,
    thickness: 0.4,
    transparent: true,
    opacity: 0.45
  });
  const body = mesh(new THREE.SphereGeometry(0.38, 20, 16), mat);
  body.scale.set(1, 0.82, 1);
  body.position.y = 0.32;

}

function buildWood(g) {
  const log = mesh(new THREE.CylinderGeometry(0.22, 0.26, 0.9, 14), woodMat);
  log.position.y = 0.45;
  const cap = mesh(new THREE.CircleGeometry(0.22, 14), new THREE.MeshStandardMaterial({ color: 0xc4a06a, roughness: 0.7 }));
  cap.rotation.x = -Math.PI / 2;
  cap.position.y = 0.9;
  g.add(log, cap);
}

function buildSandPile(g) {
  const mat = new THREE.MeshStandardMaterial({ color: 0xe2c98a, roughness: 0.95 });
  const pile = mesh(new THREE.SphereGeometry(0.42, 16, 12), mat);
  pile.scale.set(1.2, 0.45, 1.15);
  pile.position.y = 0.16;
  g.add(pile);
}

function buildRock(g) {
  const mat = new THREE.MeshStandardMaterial({
    color: randColor(0.05, 0.12, 0.02, 0.12, 0.28, 0.55),
    roughness: 0.92,
    flatShading: true
  });
  const geo = new THREE.IcosahedronGeometry(0.38 + Math.random() * 0.12, 1);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const n = 0.75 + Math.random() * 0.5;
    pos.setXYZ(i, pos.getX(i) * n, pos.getY(i) * (0.55 + Math.random() * 0.35), pos.getZ(i) * n);
  }
  geo.computeVertexNormals();
  const rock = mesh(geo, mat);
  rock.position.y = 0.22;
  rock.rotation.y = Math.random() * Math.PI;
  g.add(rock);
}

function levelRoof(positions, indices) {
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  return geo;
}

function buildHouse(g, S) {
  const scale = (S || 1) * (0.82 + Math.random() * 0.5);
  const wallColors = [0xf5f7f8, 0xe8eef2, 0xf7f5f2, 0xdfe5ea];
  const wallMat = new THREE.MeshStandardMaterial({ color: wallColors[Math.floor(Math.random() * wallColors.length)], roughness: 0.38, metalness: 0.04 });
  const roofMat = new THREE.MeshStandardMaterial({ color: 0x2b3138, roughness: 0.42, metalness: 0.18 });
  const trimMat = new THREE.MeshStandardMaterial({ color: 0x2a2f35, roughness: 0.4, metalness: 0.16 });
  const glassPane = new THREE.MeshStandardMaterial({ color: 0xd7e7f1, roughness: 0.05, metalness: 0.22, transparent: true, opacity: 0.62 });
  const w = (2 + Math.random() * 1.2) * scale;
  const d = (1.5 + Math.random() * 0.9) * scale;
  const h = (1.25 + Math.random() * 0.75) * scale;
  const t = Math.max(0.16, 0.12 * scale);
  const doorW = S === 3 ? 2.58 : Math.min(w * 0.46, Math.max(0.86, 0.48 * scale));
  let doorX = (Math.random() - 0.5) * Math.max(0.05, w - doorW - 0.5);
  doorX = Math.max(-w / 2 + 0.2, Math.min(w / 2 - doorW - 0.2, doorX));
  const hw = w / 2;
  const hd = d / 2;
  const slab = (sx, sy, sz, px, py, pz) => {
    const part = mesh(new THREE.BoxGeometry(sx, sy, sz), wallMat);
    part.position.set(px, py, pz);
    part.userData.role = "wall";
    g.add(part);
    return part;
  };
  slab(w - t * 2, 0.28 * scale, d - t * 2, 0, 0.26 * scale, 0);
  slab(t, h, d, -hw + t / 2, h / 2, 0);
  slab(t, h, d, hw - t / 2, h / 2, 0);
  slab(w, h, t, 0, h / 2, -hd + t / 2);
  const leftSpan = doorX - (-hw);
  if (leftSpan > 0.08) slab(leftSpan, h, t, -hw + leftSpan / 2, h / 2, hd - t / 2);
  const rightSpan = hw - (doorX + doorW);
  if (rightSpan > 0.08) slab(rightSpan, h, t, hw - rightSpan / 2, h / 2, hd - t / 2);
  const step = mesh(new THREE.BoxGeometry(doorW + 0.2, 0.08 * scale, 0.36), trimMat);
  step.position.set(doorX + doorW / 2, 0.1 * scale, hd + 0.12);
  g.add(step);
  const plinth = mesh(new THREE.BoxGeometry(w + 0.06, 0.12 * scale, d + 0.06), trimMat);
  plinth.position.y = 0.02 * scale;
  g.add(plinth);
  const thick = 0.11 * scale;
  const roof = mesh(new THREE.BoxGeometry(w * 1.1, thick, d * 1.1), roofMat);
  roof.position.y = h + thick / 2;
  roof.userData.role = "roof";
  g.add(roof);
  const skylight = mesh(new THREE.BoxGeometry(w * 0.26, 0.04 * scale, d * 0.2), glassPane);
  skylight.position.y = h + thick + 0.02 * scale;
  g.add(skylight);
  const doorH = (S === 3 ? 1.35 : 1) * Math.min(1.15 * scale, h * 0.82);
  const hinge = new THREE.Group();
  const doorMat = new THREE.MeshStandardMaterial({ color: 0x2c3238, roughness: 0.32, metalness: 0.28 });
  const door = mesh(new THREE.BoxGeometry(doorW, doorH, 0.07 * scale), doorMat);
  door.position.set(doorW / 2, doorH / 2, 0);
  const knob = mesh(new THREE.SphereGeometry(0.035 * scale, 8, 8), metalMat);
  knob.position.set(doorW * 0.82, doorH * 0.48, 0.05 * scale);
  hinge.add(door, knob);
  hinge.position.set(doorX, 0, hd);
  hinge.userData.role = "door";
  g.add(hinge);
  const doorState = { mesh: hinge, kind: "door", open: false, angle: 0, target: 0, radius: 4.4 };
  interactables.push(doorState);
  g.userData.shell = { w, d, t, doorX, doorW, door: doorState };
  const bandH = Math.max(0.35 * scale, h * 0.28);
  const bandY = h * 0.62;
  const sideWin = mesh(new THREE.BoxGeometry(0.05, bandH, d * 0.52), glassPane);
  sideWin.position.set(-hw - 0.02, bandY, 0);
  const sideWinR = mesh(new THREE.BoxGeometry(0.05, bandH, d * 0.52), glassPane);
  sideWinR.position.set(hw + 0.02, bandY, 0);
  const backWin = mesh(new THREE.BoxGeometry(w * 0.42, bandH, 0.05), glassPane);
  backWin.position.set(0, bandY, -hd - 0.02);
  g.add(sideWin, sideWinR, backWin);
  const doorGlass = mesh(new THREE.BoxGeometry(doorW * 0.22, doorH * 0.48, 0.02), glassPane);
  doorGlass.position.set(doorW * 0.72, doorH * 0.58, 0.05 * scale);
  hinge.add(doorGlass);
}

function buildCastle(g) {
  const W = 32;
  const D = 24;
  const T = 0.7;
  const H = 12.6;
  const mid = 4.2;
  const top = 8.4;
  const hw = W / 2;
  const hd = D / 2;
  const stone = new THREE.MeshStandardMaterial({ color: 0x8a847c, roughness: 0.92 });
  const dark = new THREE.MeshStandardMaterial({ color: 0x6a645c, roughness: 0.9 });
  const floorMat = new THREE.MeshStandardMaterial({ color: 0xa3947c, roughness: 0.86 });
  const roofMat = new THREE.MeshStandardMaterial({ color: 0x7c342c, roughness: 0.74 });
  const blocks = [];
  function addBox(sx, sy, sz, px, py, pz, mat, block) {
    const part = mesh(new THREE.BoxGeometry(sx, sy, sz), mat);
    part.position.set(px, py, pz);
    g.add(part);
    if (block) blocks.push(block);
  }
  addBox(T, H, D, -hw + T / 2, H / 2, 0, stone, { minX: -hw, maxX: -hw + T, minZ: -hd, maxZ: hd });
  addBox(T, H, D, hw - T / 2, H / 2, 0, stone, { minX: hw - T, maxX: hw, minZ: -hd, maxZ: hd });
  addBox(W, H, T, 0, H / 2, -hd + T / 2, stone, { minX: -hw, maxX: hw, minZ: -hd, maxZ: -hd + T });
  const gate = 4.4;
  const sideW = hw - gate / 2;
  addBox(sideW, H, T, -hw + sideW / 2, H / 2, hd - T / 2, stone, { minX: -hw, maxX: -gate / 2, minZ: hd - T, maxZ: hd });
  addBox(sideW, H, T, hw - sideW / 2, H / 2, hd - T / 2, stone, { minX: gate / 2, maxX: hw, minZ: hd - T, maxZ: hd });
  addBox(gate, H - 5, T, 0, 5 + (H - 5) / 2, hd - T / 2, stone, null);
  const gap = 3.2;
  const span = (W - gap) / 2;
  addBox(span, H, T, -hw + span / 2, H / 2, 0, dark, { minX: -hw, maxX: -gap / 2, minZ: -T / 2, maxZ: T / 2 });
  addBox(span, H, T, hw - span / 2, H / 2, 0, dark, { minX: gap / 2, maxX: hw, minZ: -T / 2, maxZ: T / 2 });
  addBox(gap, 0.3, T, 0, mid - 0.15, 0, dark, null);
  addBox(gap, 0.3, T, 0, top - 0.15, 0, dark, null);
  addBox(gap, 0.3, T, 0, H - 0.15, 0, dark, null);
  const stair1 = { minX: -5.4, maxX: -1.3, minZ: -10.4, maxZ: -2.2, base: 0.2, top: mid };
  const stair2 = { minX: 1.3, maxX: 5.4, minZ: -10.4, maxZ: -2.2, base: mid, top: top };
  function roomWall(x) {
    const z0 = stair1.minZ;
    const backLen = -3.4 - z0;
    addBox(T, H, backLen, x, H / 2, (z0 + -3.4) / 2, dark, { minX: x - T / 2, maxX: x + T / 2, minZ: z0, maxZ: -3.4 });
    addBox(T, H, 3.4, x, H / 2, -1.7, dark, { minX: x - T / 2, maxX: x + T / 2, minZ: -3.4, maxZ: 0 });
  }
  roomWall(-8);
  roomWall(8);
  addBox(W - T * 2, 0.16, D - T * 2, 0, 0.08, 0, floorMat, null);
  function addStair(s) {
    const steps = 12;
    const tread = (s.maxZ - s.minZ) / steps;
    const stairW = s.maxX - s.minX;
    for (let i = 0; i < steps; i++) {
      const z = s.maxZ - tread * (i + 0.5);
      const y = s.base + ((i + 1) / steps) * (s.top - s.base);
      addBox(stairW, 0.22, tread + 0.04, (s.minX + s.maxX) / 2, y, z, stone, null);
    }
  }
  function addFloor(y, hole) {
    const x0 = -hw + T;
    const x1 = hw - T;
    const z0 = -hd + T;
    const z1 = hd - T;
    addBox(hole.minX - x0, 0.24, z1 - z0, (x0 + hole.minX) / 2, y, (z0 + z1) / 2, floorMat, null);
    addBox(x1 - hole.maxX, 0.24, z1 - z0, (hole.maxX + x1) / 2, y, (z0 + z1) / 2, floorMat, null);
    addBox(hole.maxX - hole.minX, 0.24, hole.minZ - z0, (hole.minX + hole.maxX) / 2, y, (z0 + hole.minZ) / 2, floorMat, null);
    addBox(hole.maxX - hole.minX, 0.24, z1 - hole.maxZ, (hole.minX + hole.maxX) / 2, y, (hole.maxZ + z1) / 2, floorMat, null);
  }
  addStair(stair1);
  addStair(stair2);
  addFloor(mid, stair1);
  addFloor(top, stair2);
  const corners = [[-hw, -hd], [hw, -hd], [-hw, hd], [hw, hd]];
  for (let i = 0; i < corners.length; i++) {
    const cx = corners[i][0];
    const cz = corners[i][1];
    const shaft = mesh(new THREE.CylinderGeometry(2.15, 2.45, 16.5, 8), stone);
    shaft.position.set(cx, 8.25, cz);
    const cap = mesh(new THREE.ConeGeometry(2.8, 3.2, 8), roofMat);
    cap.position.set(cx, 18.1, cz);
    g.add(shaft, cap);
    blocks.push({ minX: cx - 2.2, maxX: cx + 2.2, minZ: cz - 2.2, maxZ: cz + 2.2 });
  }
  for (let i = 0; i < 18; i++) {
    if (i % 2) continue;
    const x = -hw + T + (i + 0.5) * ((W - T * 2) / 18);
    if (Math.abs(x) < gate / 2 + 0.5) continue;
    addBox(0.85, 0.75, 0.7, x, H + 0.38, hd - T / 2, stone, null);
    addBox(0.85, 0.75, 0.7, x, H + 0.38, -hd + T / 2, stone, null);
  }
  g.userData.castle = {
    blocks: blocks, hw: hw, hd: hd,
    stairs: [stair1, stair2],
    floors: [{ y: mid, hole: stair1 }, { y: top, hole: stair2 }]
  };
}

function buildTower(g) {
  const shaft = mesh(new THREE.CylinderGeometry(0.62, 0.85, 3.3, 18), stoneMat);
  shaft.position.y = 1.65;
  const roof = mesh(new THREE.ConeGeometry(1.15, 1.15, 18), new THREE.MeshStandardMaterial({ color: 0x7c342c, roughness: 0.7 }));
  roof.position.y = 3.7;
  g.add(shaft, roof);
  for (let i = 0; i < 4; i++) {
    const a = (i / 4) * Math.PI * 2;
    const win = mesh(new THREE.SphereGeometry(0.12, 10, 8), glassMat);
    win.position.set(Math.cos(a) * 0.72, 2.1, Math.sin(a) * 0.72);
    g.add(win);
  }
}

function buildWall(g) {
  const body = mesh(new THREE.BoxGeometry(6.2, 1.35, 0.32), plasterMat);
  body.position.y = 0.68;
  const cap = mesh(new THREE.CylinderGeometry(0.16, 0.16, 6.2, 12), plasterMat);
  cap.rotation.z = Math.PI / 2;
  cap.position.y = 1.35;
  g.add(body, cap);
}

function buildBridge(g) {
  const steps = 18;
  const len = 8;
  const verts = [];
  const idx = [];
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const x = (t - 0.5) * len;
    const y = Math.sin(t * Math.PI) * 1.05 + 0.12;
    verts.push(x, y, -0.7, x, y, 0.7);
    if (i < steps) {
      const a = i * 2;
      idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.Float32BufferAttribute(verts, 3));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  g.add(mesh(geo, woodMat));
  for (const z of [-0.7, 0.7]) {
    const pts = [];
    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      pts.push(new THREE.Vector3((t - 0.5) * len, Math.sin(t * Math.PI) * 1.05 + 0.42, z));
    }
    g.add(mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 24, 0.035, 6, false), woodMat));
  }
}

function buildCloud(g) {
  const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, transparent: true, opacity: 0.92, depthWrite: false });
  const blobs = [[0, 0, 0, 1.5], [1.5, 0.25, 0.2, 1.1], [-1.4, 0.1, -0.2, 1], [0.4, 0.35, -0.7, 0.8], [0.2, -0.05, 0.9, 0.75]];
  for (let i = 0; i < blobs.length; i++) {
    const b = blobs[i];
    const s = mesh(new THREE.SphereGeometry(b[3], 16, 12), mat, false);
    s.position.set(b[0], b[1], b[2]);
    g.add(s);
  }
}

function buildQuad(g, a) {
  const S = a.s * (0.82 + Math.random() * 0.4);
  const mat = new THREE.MeshStandardMaterial({
    color: new THREE.Color(a.color).offsetHSL((Math.random() - 0.5) * 0.08, (Math.random() - 0.5) * 0.2, (Math.random() - 0.5) * 0.14),
    roughness: a.fluff ? 1 : 0.65 + Math.random() * 0.2
  });
  const body = mesh(new THREE.CapsuleGeometry(a.bodyR * S, a.bodyL * S, 4, 12), mat);
  body.rotation.z = Math.PI / 2;
  body.position.y = a.leg * S;
  g.add(body);
  for (const sx of [-1, 1]) {
    for (const sz of [-1, 1]) {
      const leg = mesh(new THREE.CapsuleGeometry(0.055 * S, a.leg * S * 0.7, 3, 8), mat);
      leg.position.set(sx * a.bodyL * S * 0.32, a.leg * S * 0.42, sz * a.bodyR * S * 0.85);
      leg.userData.part = "leg";
      leg.userData.side = sx * sz;
      g.add(leg);
    }
  }
  const head = mesh(new THREE.SphereGeometry(a.head * S, 16, 12), mat);
  head.position.set(a.bodyL * S * 0.55, a.leg * S + a.head * S * 0.8, 0);
  g.add(head);
  const snout = mesh(new THREE.SphereGeometry(a.head * S * 0.45, 10, 8), mat);
  snout.position.set(head.position.x + a.head * S * 0.7, head.position.y - a.head * S * 0.1, 0);
  g.add(snout);
  if (a.ear) {
    for (const side of [-1, 1]) {
      const ear = mesh(new THREE.CapsuleGeometry(0.03 * S, a.ear * S, 2, 6), mat);
      ear.position.set(head.position.x, head.position.y + a.ear * S * 0.35, side * a.head * S * 0.45);
      g.add(ear);
    }
  }
  if (a.antler) {
    for (const side of [-1, 1]) {
      const ant = mesh(new THREE.ConeGeometry(0.03 * S, 0.28 * S, 6), mat);
      ant.position.set(head.position.x, head.position.y + 0.22 * S, side * 0.06 * S);
      g.add(ant);
    }
  }
  const tail = mesh(new THREE.CapsuleGeometry(0.04 * S, 0.22 * S, 2, 6), mat);
  tail.position.set(-a.bodyL * S * 0.55, a.leg * S + 0.05, 0);
  tail.rotation.z = Math.PI / 2.6;
  tail.userData.part = "tail";
  g.add(tail);
}

function buildHuman(g, opt) {
  opt = Object.assign({}, opt, {
    s: opt.s * (0.88 + Math.random() * 0.28),

    shirt: randColor(0, 1, 0.25, 0.7, 0.28, 0.62),
    pants: randColor(0.55, 0.75, 0.05, 0.4, 0.12, 0.4),
    hair: randColor(0.02, 0.12, 0.2, 0.8, 0.08, 0.45),
    long: Math.random() > 0.45,
    broad: Math.random() > 0.5,
    head: (opt.head || 1) * (0.9 + Math.random() * 0.22)
  });
  const S = opt.s;
  const skin = new THREE.MeshStandardMaterial({ color: opt.skin, roughness: 0.58, metalness: 0.02 });
  const shirt = new THREE.MeshStandardMaterial({ color: opt.shirt, roughness: 0.82 });
  const pants = new THREE.MeshStandardMaterial({ color: opt.pants, roughness: 0.84 });
  const hair = new THREE.MeshStandardMaterial({ color: opt.hair, roughness: 0.65 });
  const shoe = new THREE.MeshStandardMaterial({ color: 0x2c2622, roughness: 0.55 });
  function cap(r, len, material) {
    return mesh(new THREE.CapsuleGeometry(r, len, 5, 12), material);
  }
  for (const x of [-0.11, 0.11]) {
    const hip = new THREE.Group();
    hip.position.set(x * S, 0.58 * S, 0);
    hip.userData.part = "leg";
    hip.userData.side = x;
    const leg = cap(0.085 * S, 0.38 * S, pants);
    leg.position.y = -0.2 * S;
    const foot = mesh(new THREE.SphereGeometry(0.09 * S, 12, 10), shoe);
    foot.scale.set(1, 0.5, 1.45);
    foot.position.set(0, -0.48 * S, 0.06 * S);
    hip.add(leg, foot);
    g.add(hip);
  }
  const torso = cap(0.2 * S, 0.36 * S, shirt);
  torso.position.y = 0.95 * S;
  torso.scale.x = opt.broad ? 1.15 : 1;
  const neck = mesh(new THREE.CylinderGeometry(0.055 * S, 0.07 * S, 0.12 * S, 12), skin);
  neck.position.y = 1.28 * S;
  g.add(neck);
  for (const x of [-1, 1]) {
    const shoulder = new THREE.Group();
    shoulder.position.set(x * 0.3 * S, 1.16 * S, 0);
    shoulder.userData.part = "arm";
    shoulder.userData.side = x;
    shoulder.rotation.z = x * -0.08;
    const arm = cap(0.065 * S, 0.32 * S, x === 1 ? shirt : skin);
    arm.position.y = -0.2 * S;
    const hand = mesh(new THREE.SphereGeometry(0.055 * S, 10, 8), skin);

  hairMesh.position.y = (opt.long ? 1.5 : 1.58) * S;

  const white = new THREE.MeshStandardMaterial({ color: 0xf5f5f5, roughness: 0.25 });

function buildCar(g, color, stretch) {
  const paint = new THREE.MeshStandardMaterial({
    color: randColor(0, 1, 0.25, 0.8, 0.16, 0.55),
    roughness: 0.28,
    metalness: 0.55
  });
  const dark = new THREE.MeshStandardMaterial({ color: 0x1c1e22, roughness: 0.45, metalness: 0.4 });
  const len = (2.3 + Math.random() * 0.7) * (stretch || 1);
  const wid = 1.05 + Math.random() * 0.2;
  const bodyH = 0.42 + Math.random() * 0.12;
  const body = mesh(new THREE.BoxGeometry(len, bodyH, wid), paint);
  body.position.y = 0.46;
  const skirt = mesh(new THREE.BoxGeometry(len * 0.96, 0.16, wid * 0.92), dark);
  skirt.position.y = 0.28;
  const cabH = 0.38 + Math.random() * 0.12;
  const cab = mesh(new THREE.BoxGeometry(len * 0.48, cabH, wid * 0.86), glassMat);
  cab.position.set(-len * 0.04, 0.46 + bodyH * 0.5 + cabH * 0.42, 0);
  const hood = mesh(new THREE.BoxGeometry(len * 0.28, 0.06, wid * 0.7), paint);
  hood.position.set(len * 0.3, 0.46 + bodyH * 0.45, 0);
  const lightMat = new THREE.MeshStandardMaterial({ color: 0xfff1c4, emissive: 0xffe2a0, emissiveIntensity: 0.6, roughness: 0.2 });
  for (const z of [-1, 1]) {
    const lamp = mesh(new THREE.BoxGeometry(0.08, 0.1, 0.16), lightMat);
    lamp.position.set(len * 0.48, 0.5, z * wid * 0.32);
    g.add(lamp);
  }
  const rubber = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.75 });
  const hub = new THREE.MeshStandardMaterial({ color: 0xc5c8ce, roughness: 0.3, metalness: 0.8 });
  const xs = stretch > 1.2 ? [-len * 0.32, 0, len * 0.32] : [-len * 0.32, len * 0.3];
  for (const x of xs) {
    for (const z of [-1, 1]) {
      const wheel = mesh(new THREE.CylinderGeometry(0.24, 0.24, 0.16, 16), rubber);
      wheel.rotation.x = Math.PI / 2;
      wheel.position.set(x, 0.24, z * (wid * 0.5 + 0.02));
      const cap = mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.18, 12), hub);
      cap.rotation.x = Math.PI / 2;
      cap.position.copy(wheel.position);
      g.add(wheel, cap);
    }
  }
  g.add(body, skirt, cab, hood);
}

function buildRoad(g, x, z, yaw) {
  const len = 26;
  const width = 1.7;
  const steps = 22;
  const dirx = Math.sin(yaw);
  const dirz = Math.cos(yaw);
  const sx = dirz;
  const sz = -dirx;
  const verts = [];
  const idx = [];
  for (let i = 0; i <= steps; i++) {
    const t = (i / steps - 0.5) * len;
    const cx = x + dirx * t;
    const cz = z + dirz * t;
    const y = walkY(cx, cz) + 0.07;
    verts.push(cx + sx * width, y, cz + sz * width, cx - sx * width, y, cz - sz * width);
    if (i < steps) {
      const a = i * 2;
      idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.Float32BufferAttribute(verts, 3));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  const road = mesh(geo, new THREE.MeshStandardMaterial({ color: 0x4a4e53, roughness: 0.9 }));
  g.add(road);
}

const splashMat = new THREE.MeshBasicMaterial({ color: 0xe7f6ff, transparent: true, opacity: 0.8, depthWrite: false, side: THREE.DoubleSide });
const splashes = [];
function makeSplash(x, z) {
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.12, 0.28, 28), splashMat.clone());
  ring.rotation.x = -Math.PI / 2;
  ring.position.set(x, WATER + 0.08, z);
  scene.add(ring);
  const drops = [];
  for (let i = 0; i < 10; i++) {
    const drop = new THREE.Mesh(new THREE.SphereGeometry(0.045, 6, 6), splashMat.clone());
    drop.position.set(x, WATER + 0.12, z);
    scene.add(drop);
    drops.push({ mesh: drop, v: new THREE.Vector3((Math.random() - 0.5) * 2.6, 1.5 + Math.random() * 2.4, (Math.random() - 0.5) * 2.6) });
  }
  splashes.push({ ring, drops, age: 0 });
}
function updateSplashes(dt) {
  for (let i = splashes.length - 1; i >= 0; i--) {
    const s = splashes[i];
    s.age += dt;
    const k = Math.min(1, s.age / 0.85);
    s.ring.scale.setScalar(1 + k * 6);
    s.ring.material.opacity = 0.75 * (1 - k);
    for (let d = 0; d < s.drops.length; d++) {
      const drop = s.drops[d];
      drop.v.y -= 9 * dt;
      drop.mesh.position.addScaledVector(drop.v, dt);
      drop.mesh.material.opacity = 0.8 * (1 - k);
    }
    if (s.age > 0.85) {
      scene.remove(s.ring);
      s.ring.geometry.dispose();
      s.ring.material.dispose();
      for (let d = 0; d < s.drops.length; d++) {
        scene.remove(s.drops[d].mesh);
        s.drops[d].mesh.geometry.dispose();
        s.drops[d].mesh.material.dispose();
      }
      splashes.splice(i, 1);
    }
  }
}

function supportY(o) {
  const bed = sampleHeight(o.mesh.position.x, o.mesh.position.z);
  let y = o.floats ? Math.max(bed, WATER) : bed;
  for (let i = 0; i < objects.length; i++) {
    const other = objects[i];
    if (other === o || !other.resting || !other.solid) continue;
    const dx = other.mesh.position.x - o.mesh.position.x;
    const dz = other.mesh.position.z - o.mesh.position.z;
    const horiz = Math.hypot(dx, dz);
    const stand = Math.max(0.25, Math.min(o.radius || 0.4, other.radius) * 0.5);
    if (horiz <= stand) y = Math.max(y, other.mesh.position.y + other.top);
  }
  return y;
}

function freeSpot(x, z, radius) {
  for (let i = 0; i < 12; i++) {
    const ang = i * 1.15;
    const dist = i === 0 ? 0 : radius + 0.4 + i * 0.45;
    const px = x + Math.cos(ang) * dist;
    const pz = z + Math.sin(ang) * dist;
    let ok = true;
    for (let j = 0; j < objects.length; j++) {
      const o = objects[j];
      if (!o.solid) continue;
      const dx = o.mesh.position.x - px;
      const dz = o.mesh.position.z - pz;
      const need = o.radius + radius;
      if (dx * dx + dz * dz < need * need) ok = false;
    }
    if (ok) return { x: px, z: pz };
  }
  return { x, z };
}

function isPersonSpec(spec) {
  return !!(spec && (spec.id === "man" || spec.id === "woman" || spec.id === "child" || spec.id === "person"));
}

function isPerson(o) {
  return isPersonSpec(o && o.spec);
}

function giveName(spec) {
  const pool = NAME_POOL[spec.id] || NAME_POOL.person;
  for (let i = 0; i < pool.length; i++) {
    if (!usedNames.has(pool[i])) {
      usedNames.add(pool[i]);
      return pool[i];
    }
  }
  const name = pool[0] + (usedNames.size + 1);
  usedNames.add(name);
  return name;
}

function attachName(o) {
  const canvas = document.createElement("canvas");
  canvas.width = 320;
  canvas.height = 80;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "rgba(18,16,12,0.88)";
  ctx.fillRect(0, 6, 320, 68);
  ctx.strokeStyle = "#c6a15a";
  ctx.lineWidth = 4;
  ctx.strokeRect(2, 8, 316, 64);
  ctx.fillStyle = "#f4efe4";
  ctx.font = "bold 36px 'Noto Sans CJK SC', 'Noto Serif SC', 'Source Han Sans SC', sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(o.npcName, 160, 42);
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
  sprite.raycast = function () {};
  sprite.position.y = 2.2;
  sprite.scale.set(1.9, 0.48, 1);
  sprite.center.set(0.5, 0);
  o.mesh.add(sprite);
  o.nameSprite = sprite;
}

function spawn(spec, x, z, opt) {
  opt = opt || {};
  if (!spec) return null;
  if (isPersonSpec(spec) && objects.filter(isPerson).length >= MAX_PEOPLE) {
    if (!opt.quiet) speak("神谕", "人已经够多了。靠近要离开的人，按 Delete。");
    return null;
  }
  const group = new THREE.Group();
  if (spec.world) {
    buildRoad(group, x, z, opt.yaw == null ? view.yaw : opt.yaw);
    scene.add(group);
    const road = { spec, mesh: group, radius: spec.radius, top: spec.height, solid: false, behavior: "static", resting: true, vy: 0, phase: 0, baseY: 0 };
    objects.push(road);
    return road;
  }
  spec.build(group);
  let px = x;
  let pz = z;
  if (spec.solid !== false && spec.behavior !== "sky") {
    const spot = freeSpot(x, z, spec.radius);
    px = spot.x;
    pz = spot.z;
  }
  group.position.set(px, 0, pz);
  if (opt.yaw != null) group.rotation.y = opt.yaw;
  else if (spec.behavior !== "sky" && !spec.terrain) group.rotation.y = Math.random() * Math.PI * 2;
  scene.add(group);
  const box = new THREE.Box3().setFromObject(group);
  const measured = Math.max(0.2, box.max.y - Math.min(0, box.min.y));
  const o = {
    spec, mesh: group, radius: spec.radius, top: measured,
    solid: spec.solid !== false, behavior: spec.behavior || "fall",
    floats: !!spec.floats, splashed: false,
    resting: false, vy: 0, phase: Math.random() * 6, baseY: 0
  };
  if (group.userData.shell) o.shell = group.userData.shell;
  if (group.userData.castle) o.castle = group.userData.castle;
  objects.push(o);
  if (o.behavior === "wander") {
    o.homeX = px;
    o.homeZ = pz;
    const head = Math.random() * Math.PI * 2;
    o.goalX = px + Math.cos(head) * 3;
    o.goalZ = pz + Math.sin(head) * 3;
    o.pause = 0.15;
    o.stuck = 0;
    o.speed = spec.id === "dog" ? 1.9 : 2.05;
    o.order = "wander";
    o.tricks = {};
    o.say = "";
    o.sayT = 0;
    o.wave = 0;
    o.held = false;
    group.position.y = sampleHeight(px, pz);
    o.resting = true;
    if (isPerson(o)) {
      o.npcName = opt.name || giveName(spec);
      if (opt.name) usedNames.add(opt.name);
      o.foe = null;
      attachName(o);
      o.life = "out";
      o.lifeT = 8 + Math.random() * 6;
      chooseWanderGoal(o);
    }
  } else if (o.behavior === "sky") {
    group.position.y = 40 + Math.random() * 14;
    o.resting = true;
  } else if (o.behavior === "bob") {
    o.baseY = walkY(px, pz) + 8;
    group.position.y = o.baseY;
    o.resting = true;
  } else if (o.behavior === "float") {
    group.position.y = WATER - 0.05;
    o.resting = true;
  } else if (opt.settle) {
    group.position.y = supportY(o);
    o.resting = true;
  } else {
    const bed = supportY(o);
    group.position.y = (!o.floats && bed < WATER - 0.15) ? Math.max(bed + 4, WATER + 2.4) : bed + 4;
  }
  return o;
}

function localOf(o, lx, lz) {
  const yaw = o.mesh.rotation.y;
  const c = Math.cos(yaw);
  const s = Math.sin(yaw);
  return {
    x: o.mesh.position.x + lx * c + lz * s,
    z: o.mesh.position.z - lx * s + lz * c
  };
}

function setDoor(house, open) {
  const door = house && house.shell && house.shell.door;
  if (!door) return;
  door.open = !!open;
  door.target = open ? 1.2 : 0;
}

function homePoints(person) {
  const h = person.house;
  const s = h.shell;
  const mid = s.doorX + s.doorW * 0.5;
  return {
    outside: localOf(h, mid, s.d / 2 + 1.45),
    inside: localOf(h, 0, -0.15)
  };
}

function findHomePlot(x, z) {
  for (let r = 18; r <= 78; r += 6) {
    for (let a = 0; a < 6.28; a += 0.5) {
      const gx = x + Math.cos(a) * r;
      const gz = z + Math.sin(a) * r;
      if (Math.abs(gx) > WORLD - 14 || Math.abs(gz) > WORLD - 14) continue;
      if (sampleHeight(gx, gz) < WATER + 1) continue;
      let crowded = false;
      for (let i = 0; i < objects.length; i++) {
        const o = objects[i];
        if (!o.spec) continue;
        const dist = Math.hypot(o.mesh.position.x - gx, o.mesh.position.z - gz);
        if ((o.spec.id === "house" || o.spec.id === "cabin") && dist < 16) crowded = true;
        if (o.spec.id === "castle" && dist < 28) crowded = true;
      }
      if (crowded) continue;
      return { x: gx, z: gz, yaw: Math.atan2(x - gx, z - gz) };
    }
  }
  return null;
}

function giveHome(person) {
  const plot = findHomePlot(person.mesh.position.x, person.mesh.position.z);
  if (!plot) return;
  const house = spawn(byId.house, plot.x, plot.z, { settle: true, yaw: plot.yaw, quiet: true });
  if (!house || !house.shell) return;
  house.forPerson = person;
  person.house = house;
  const pts = homePoints(person);
  const bed = sampleHeight(pts.outside.x, pts.outside.z);
  person.mesh.position.set(pts.outside.x, bed < WATER + 0.3 ? house.mesh.position.y : bed, pts.outside.z);
  person.homeX = pts.outside.x;
  person.homeZ = pts.outside.z;
  person.goalX = pts.outside.x + 1.2;
  person.goalZ = pts.outside.z + 1.2;
}

function addTerrainFeature(spec, x, z) {
  if (spec.id === "mountain") mods.push({ kind: "mountain", x, z, r: 16 + Math.random() * 8, amp: 22 + Math.random() * 10, grow: 0 });
  else if (spec.id === "lake") mods.push({ kind: "lake", x, z, r: 16, depth: 4.2, grow: 0 });
  else if (spec.id === "water") mods.push({ kind: "lake", x, z, r: 7, depth: 1.8, grow: 0 });
  else if (spec.id === "river") mods.push({ kind: "river", x, z, yaw: view.yaw, len: 42, width: 4.8, grow: 0 });
  else if (spec.id === "sand") mods.push({ kind: "sand", x, z, r: 9, grow: 1 });
  terrainDirty = true;
}

function lookPoint() {
  const origin = camera.position.clone();
  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  raycaster.set(origin, dir);
  const hits = raycaster.intersectObject(terrain, false);
  return hits[0] ? hits[0].point : null;
}

function pointFromEvent(ev) {
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((ev.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((ev.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObject(terrain, false);
  return hits[0] ? hits[0].point : null;
}

const sharedMats = new Set([woodMat, barkMat, leafMat, leafMat2, stoneMat, plasterMat, metalMat, glassMat]);

function disposeTree(root) {
  const seen = new Set();
  root.traverse((node) => {
    if (!node.isMesh) return;
    if (node.geometry && !seen.has(node.geometry)) {
      seen.add(node.geometry);
      node.geometry.dispose();
    }
    const mats = Array.isArray(node.material) ? node.material : [node.material];
    for (let i = 0; i < mats.length; i++) {
      const mat = mats[i];
      if (!mat || sharedMats.has(mat) || seen.has(mat)) continue;
      seen.add(mat);
      if (mat.map && mat.map !== plasterMap && mat.map !== barkMap) mat.map.dispose();
      mat.dispose();
    }
  });
}

function removeObject(o) {
  const i = objects.indexOf(o);
  if (i < 0) return false;
  for (let k = interactables.length - 1; k >= 0; k--) {
    let node = interactables[k].mesh;
    while (node && node !== o.mesh) node = node.parent;
    if (node === o.mesh) interactables.splice(k, 1);
  }
  scene.remove(o.mesh);
  disposeTree(o.mesh);
  objects.splice(i, 1);
  return true;
}
